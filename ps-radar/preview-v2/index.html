[hidden]{display:none!important}
.radar-dashboard{padding:4px 0 20px}.ri-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0 16px}.ri-heading h2{font-size:21px;margin:0}.ri-heading p,.ri-note{color:var(--muted);font-size:12px;line-height:1.6;margin:7px 0}.ri-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}.ri-stat{padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}.ri-stat strong{display:block;font-size:22px;color:var(--cyan);margin-top:5px}.ri-stat span{font-size:11px;color:var(--muted)}.ri-sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.ri-section{min-width:0;padding:13px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(140deg,#09243b,#051525)}.ri-section header{display:flex;justify-content:space-between;align-items:center;gap:8px}.ri-section h3{font-size:14px;margin:0}.ri-section header span{color:var(--cyan);font-size:12px}.ri-description{color:var(--muted);font-size:11px;line-height:1.5;min-height:33px}.ri-game{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:1px solid transparent;border-top-color:var(--line);background:transparent;padding:11px 0;cursor:pointer}.ri-game:hover,.ri-game:focus-visible{background:#0c304b;border-color:var(--cyan);border-radius:7px}.ri-game .deal-cover{width:44px;height:55px;flex:0 0 44px;border-radius:5px}.ri-game-copy{min-width:0;flex:1}.ri-game-copy b{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ri-game-copy strong{display:block;font-size:13px;color:var(--text);margin-top:4px}.ri-game-copy small{display:block;font-size:10px;color:var(--muted);line-height:1.5;margin-top:4px}.ri-show{width:100%;border:1px solid var(--line);border-radius:8px;background:#0a2a44;padding:8px;font-size:11px;cursor:pointer}.ri-empty{padding:14px 0;color:var(--muted);font-size:12px;line-height:1.6}
@media(max-width:1000px){.ri-sections{grid-template-columns:1fr}}

.catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;padding:4px 0 14px}.catalog-card{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--panel2);overflow:hidden}.catalog-cover-button{padding:0;border:0;background:none;width:100%;cursor:pointer}.catalog-cover{width:100%;aspect-ratio:3/4;background-size:cover;background-position:center;display:grid;place-items:center}.catalog-copy{padding:11px;display:grid;gap:7px}.catalog-copy b{font-size:12px;line-height:1.5;min-height:36px}.catalog-copy strong{font-size:16px}.catalog-copy small{font-size:10px;color:var(--muted);line-height:1.5}.catalog-wish{position:absolute;top:8px;right:8px;border:1px solid #366388;background:#03111ddd;color:#e8faff;border-radius:50%;width:32px;height:32px;cursor:pointer}.catalog-copy button,.catalog-product-detail button{border:1px solid var(--line);background:#0c3554;padding:10px;color:white;border-radius:9px;cursor:pointer}.catalog-product-detail{padding:18px;line-height:1.7}.catalog-product-detail p{color:var(--muted);font-size:13px}.catalog-product-detail a{display:block;margin:16px 0;color:var(--cyan)}.catalog-detail-cover{height:240px;background-size:cover;background-position:center;border-radius:13px}.catalog-empty{color:var(--muted);padding:25px}.rail-nav{gap:3px}.rail-nav .nav-item{height:62px}

<body>

            <button class="chip" data-filter="lowest">관측 최저가</button>
            <select id="sortSelect" class="chip select-chip" aria-label="정렬">
              <option value="release">발매일 최신순</option><option value="rating">평점 높은순</option><option value="ratingCount">평가 수 많은순</option><option value="upcomingRelease">출시일 가까운순</option><option value="timing">추천순</option>
              <option value="discount">할인율 높은 순</option>
              <option value="price">가격 낮은 순</option>
              <option value="nearLow">관측 최저가 근접 순</option>
              <option value="ending">종료 임박 순</option>
              <option value="title">이름순</option>
            </select>
          </div>

          <div id="radarStrip" class="radar-filter-strip" hidden>
            <button class="radar-chip active" data-radar-mode="dashboard">◉ 대시보드</button>
            <button class="radar-chip" data-radar-mode="best">◎ 핵심 추천</button>
            <button class="radar-chip" data-radar-mode="low">⌄ 최저가권</button>

            <button class="radar-chip" data-radar-mode="deepening">↘ 할인폭 확대</button>
          </div>

          <div id="filterDrawer" class="filter-drawer" hidden>
            <div class="filter-drawer-head">
              <div><b>상세 필터</b><span>원하는 조건을 조합해서 할인 게임을 좁혀보세요.</span></div>
              <div class="filter-head-actions"><button id="filterReset" type="button">전체 초기화</button><button id="filterCollapse" type="button">접기 ▲</button></div>
            </div>
            <div class="filter-grid">
              <label>플랫폼
                <select id="platformFilter"><option value="all">전체</option><option value="PS5">PS5</option><option value="PS4">PS4</option></select>
              </label>
              <label>최소 할인율
                <select id="discountMin"><option value="0">전체</option><option value="30">30%+</option><option value="40">40%+</option><option value="50">50%+</option><option value="60">60%+</option><option value="70">70%+</option><option value="80">80%+</option></select>
              </label>
              <label>최대 가격
                <select id="priceMax"><option value="0">전체</option><option value="10000">1만원 이하</option><option value="20000">2만원 이하</option><option value="30000">3만원 이하</option><option value="50000">5만원 이하</option><option value="70000">7만원 이하</option></select>
              </label>
              <label>구매 타이밍
                <select id="timingFilter"><option value="all">전체</option><option value="BUY NOW">BUY NOW</option><option value="GOOD">GOOD</option><option value="WAIT">WAIT</option><option value="WATCH">WATCH</option></select>
              </label>
              <label>최저가 상태
                <select id="lowFilter"><option value="all">전체</option><option value="near">관측 최저가권</option><option value="exact">관측 최저가</option><option value="above">과거보다 비쌈</option></select>
              </label>
              <label>데이터 신뢰도
                <select id="confidenceFilter"><option value="all">전체</option><option value="medium">보통 이상</option><option value="high">높음만</option></select>
              </label>
            </div>
            <label class="check-label"><input id="koOnly" type="checkbox" /> 한국어 확인 게임만</label>
          </div>
        </header>

        <div id="sectionContext" class="section-context" hidden></div>
        <div id="dealList" class="deal-list" aria-live="polite"></div>
        <button id="loadMore" class="load-more" hidden>더 보기</button>
      </section>

      <section class="detail-pane panel" id="detailPane">
        <button id="mobileBack" class="mobile-back" aria-label="할인 목록으로 돌아가기">‹ 목록</button>
        <div id="detailContent" hidden>
          <section id="detailHero" class="detail-hero">
            <div class="hero-shade"></div>
            <div class="hero-top-actions">
              <button id="shareBtn" class="hero-action" aria-label="공유">↗</button>
              <button id="wishBtn" class="hero-action" aria-label="찜하기">♡</button>
            </div>
            <div class="hero-copy">
              <div id="heroTags" class="tag-row"></div>
              <h2 id="heroTitle"></h2>
              <p id="heroMaker">PlayStation Store</p>
              <div class="price-block">
                <span id="heroDiscount" class="discount-badge"></span>
                <strong id="heroPrice"></strong>
                <del id="heroOriginal"></del>
              </div>
              <div class="sale-clock"><span>◷</span><span id="saleClockText">할인 종료일 미확인</span></div>
            </div>
            <div id="timingBadge" class="timing-badge">
              <span class="cart-icon">🛒</span>
              <b>WATCH</b>
              <small>데이터 확인 중</small>

          </section>

          <nav class="detail-tabs" aria-label="게임 상세 메뉴">

            <button class="detail-tab" data-detail-tab="review">평가/리뷰</button>
            <button class="detail-tab" data-detail-tab="similar">비슷한 게임</button>
          </nav>

          <section id="priceTab" class="detail-tab-pane active" data-tab-pane="price">
            <section id="timingCard" class="timing-card">
              <div class="timing-copy">
                <p class="eyebrow">● 구매 타이밍 분석</p>
                <h3 id="timingHeadline">분석 중</h3>
                <p id="timingReason"></p>
              </div>
              <div id="timingScoreRing" class="score-ring"><strong>--</strong><small>구매 타이밍</small></div>
            </section>

            <div id="metricStrip" class="metric-strip"></div>

              <div class="card-head">
                <h3>⌕ 가격 추세</h3>

          </section>

  <script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const REMOTE_BASE='https://raw.githubusercontent.com/2062245-del/-/main/ps-radar/data/';
const DATA_TIMEOUT_MS=10000;
const LOCAL_HISTORY_KEY='psr2-observed-history-v2';
const state={catalog:[],upcoming:[],allProducts:[],deals:[],trends:{},history:{},store:new Map(),meta:new Map(),filtered:[],selected:null,filter:'all',sort:'timing',platformFilter:'all',minDiscount:0,maxPrice:0,timingFilter:'all',lowFilter:'all',confidenceFilter:'all',koOnly:false,query:'',visible:60,nav:'catalog',radarMode:'dashboard',dataSource:'bundle',generatedAt:null,busy:false};
const wish=new Set(JSON.parse(localStorage.getItem('psr2-wish')||'[]'));
let localHistory={}; try{localHistory=JSON.parse(localStorage.getItem(LOCAL_HISTORY_KEY)||'{}')||{}}catch{}
const nf=new Intl.NumberFormat('ko-KR');
const won=n=>Number.isFinite(Number(n))&&Number(n)>0?`${nf.format(Number(n))}원`:'가격 미확인';
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));
const cleanStore=value=>{try{const u=new URL(value);u.search='';u.hash='';return u.href.replace(/\/$/,'')}catch{return String(value||'').split('?')[0].replace(/\/$/,'')}};
const keyFor=g=>cleanStore(g?.store)||g?.productId||g?.id;
const excluded=/익스펜션\s*패스|시즌\s*패스|season\s*pass|add[- ]?on|추가\s*콘텐츠|dlc\b|코인\b|포인트\b|가상\s*화폐|사운드트랙|soundtrack|아트북|artbook|스킨\b|의상\b|캐릭터\s*팩|아이템\s*팩/i;
const normalizeSearch=value=>String(value||'').normalize('NFC').toLowerCase().replace(/[^0-9a-z가-힣ㄱ-ㅎㅏ-ㅣ\u1100-\u11ff]+/g,'');
const searchHaystack=g=>[g?.title,g?.storeTitle,g?.desc,g?.productId,...(g?.genre||[]),...(g?.platform||[])].filter(Boolean).join(' ');


function productPlatform(g){
  const id=String(g?.productId||g?.store||'').toUpperCase();
  if(/(?:PS5|PPSA)/.test(id))return 'PS5';
  if(/(?:PS4|CUSA)/.test(id))return 'PS4';
  return (g?.platform||[]).length===1?g.platform[0]:null;
}
function displayPlatforms(g){const p=productPlatform(g);return p?[p]:[...(g?.platform||[])];}
function sameTitleCount(g){const t=normalizeSearch(g?.title);return state.deals.filter(x=>normalizeSearch(x?.title)===t).length;}
function editionLabel(g){const p=productPlatform(g);return sameTitleCount(g)>1&&p?`${p} 버전`:p||'';}
function validHistoricalPoint(g,x){
  const price=Number(x?.price),disc=Number(x?.discount),original=Number(g?.originalPrice);
  if(!(price>0))return false;
  if(original>0&&price>original*1.03)return false;
  if(original>0&&Number.isFinite(disc)&&disc>0){const calc=(1-price/original)*100;if(Math.abs(calc-disc)>8)return false;}
  return true;
}
function resetAllFilters(){
  state.filter='all';state.platformFilter='all';state.minDiscount=0;state.maxPrice=0;state.timingFilter='all';state.lowFilter='all';state.confidenceFilter='all';state.koOnly=false;state.visible=60;
  $$('.chip[data-filter]').forEach(x=>x.classList.toggle('active',x.dataset.filter==='all'));
  const values={platformFilter:'all',discountMin:'0',priceMax:'0',timingFilter:'all',lowFilter:'all',confidenceFilter:'all'};for(const [id,v] of Object.entries(values)){const el=$('#'+id);if(el)el.value=v}const ko=$('#koOnly');if(ko)ko.checked=false;
}
function clearDetailForNoResults(){$('#catalogProductDetail')?.remove();

function collapsePriceChanges(obs){
  const out=[];
  for(const x of obs||[]){
    if(!(Number(x?.price)>0))continue;
    const last=out.at(-1);
    if(!last||Number(last.price)!==Number(x.price)||Number(last.discount)!==Number(x.discount))out.push({...x});
    else{last.at=x.at||last.at;last.day=x.day||last.day;last.source=x.source||last.source}
  }
  return out;
}
function renderTrend(g,a){
  const box=$('#trendChart'),changes=collapsePriceChanges(a.obs);
  $('#trendPeriod').textContent=changes.length>=2?`실제 변동 ${changes.length}회`:`관측 ${Math.max(1,a.observedRuns)}회`;
  if(changes.length<2){
    const list=Math.max(Number(g.originalPrice)||0,Number(g.currentPrice)||0);
    const current=Number(g.currentPrice)||0;
    const ratio=list>0?clamp((current/list)*100,4,100):100;
    box.innerHTML=`<div class="trend-baseline">
      <div class="trend-state-title"><b>아직 실제 가격 변동 이력이 없습니다</b><span>PS Radar가 앞으로 가격이 바뀔 때마다 자동으로 기록합니다.</span></div>

      <div class="price-reference-row current"><label>현재가</label><div class="reference-track"><span class="reference-current" style="width:${ratio}%"></span></div><strong>${won(current)}</strong></div>
      <div class="trend-observation-meta"><span>관측 시작 ${dateLabel(a.obs[0]?.at||a.obs[0]?.day)}</span><span>현재 -${g.discountPercent}%</span><span>변동 감시 중</span></div>
    </div>`;
    $('#trendNote').textContent=`동일 가격을 여러 번 관측한 것은 가격 변동으로 부풀리지 않습니다. 실제 가격이 변하면 이 영역에 날짜별 추세가 그려집니다.`;
    return;
  }
  $('#trendNote').textContent=`실제 가격 변화 ${changes.length}개 · 할인 사이클 ${a.saleCycles||1}회 · ${a.direction==='improving'?'최근 할인폭 확대':a.direction==='weakening'?'최근 할인폭 축소':'최근 할인폭 안정'} 추세입니다.`;
  const w=640,h=230,pL=52,pR=20,pT=22,pB=34;
  const prices=changes.map(x=>Number(x.price));
  let min=Math.min(...prices),max=Math.max(...prices,Number(g.originalPrice)||0);
  if(min===max){min*=.9;max*=1.1}
  const range=Math.max(1,max-min),chartH=h-pT-pB,chartW=w-pL-pR;
  const x=i=>pL+chartW*(i/(changes.length-1));
  const y=v=>pT+chartH*(1-(v-min)/range);
  const pts=changes.map((o,i)=>`${x(i)},${y(o.price)}`).join(' ');
  let grid='',labels='';
  for(let i=0;i<4;i++){
    const val=max-range*(i/3),gy=y(val);
    grid+=`<line class="grid" x1="${pL}" y1="${gy}" x2="${w-pR}" y2="${gy}"/><text class="axis-label y" x="${pL-8}" y="${gy+4}" text-anchor="end">${Math.round(val/1000)}k</text>`;
  }
  const labelIdx=new Set([0,changes.length-1,Math.floor((changes.length-1)/2)]);
  [...labelIdx].sort((a,b)=>a-b).forEach(i=>{const d=String(changes[i].day||changes[i].at||'').slice(5,10).replace('-','.');labels+=`<text class="axis-label x" x="${x(i)}" y="${h-8}" text-anchor="${i===0?'start':i===changes.length-1?'end':'middle'}">${d}</text>`});
  const lowY=y(a.low);
  box.innerHTML=`<svg class="trend-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${grid}<line class="low-line" x1="${pL}" y1="${lowY}" x2="${w-pR}" y2="${lowY}"/><polyline class="line" points="${pts}"/>${changes.map((o,i)=>`<circle class="point" cx="${x(i)}" cy="${y(o.price)}" r="5"><title>${String(o.day||o.at).slice(0,10)} ${won(o.price)} (-${o.discount}%)</title></circle>`).join('')}${labels}</svg>`;
}

let searchComposing=false,searchTimer=0;
const K_L=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const K_V=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const K_T=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function composeKoreanJamo(value){
  const chars=Array.from(String(value||''));let out='';
  for(let i=0;i<chars.length;){
    const l=K_L.indexOf(chars[i]);const v=(i+1<chars.length)?K_V.indexOf(chars[i+1]):-1;
    if(l>=0&&v>=0){
      let t=0,step=2;
      if(i+2<chars.length){
        const tc=K_T.indexOf(chars[i+2]);
        if(tc>0){
          const followedByVowel=i+3<chars.length&&K_V.includes(chars[i+3]);
          const canStartNext=K_L.includes(chars[i+2]);
          if(!(followedByVowel&&canStartNext)){t=tc;step=3;}
        }
      }
      out+=String.fromCharCode(0xAC00+((l*21+v)*28+t));i+=step;continue;
    }
    out+=chars[i++];
  }
  return out.normalize('NFC');
}
