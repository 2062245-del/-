<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04111f">
<title>PS Radar 2.2.5 Preview</title>
<style>
html,body{height:100%;margin:0;background:#04111f;color:#eaf4ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center}.loading{width:min(420px,calc(100% - 40px));text-align:center}.mark{width:62px;height:62px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#1675ff,#683dff);font-size:25px;font-weight:900;box-shadow:0 18px 50px #006cff33}.spin{display:inline-block;margin-right:7px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}h1{font-size:22px;margin:0 0 8px}p{color:#8da6bf;margin:0;line-height:1.55;font-size:14px}.error{color:#ff8fa1}.retry{margin-top:16px;border:1px solid #29435d;background:#0c2034;color:#fff;border-radius:12px;padding:10px 16px;font-weight:800}
</style>
</head>
<body>
<div class="loading"><div class="mark">PS</div><h1><span class="spin">↻</span>PS Radar 미리보기 불러오는 중</h1><p id="status">온라인 데이터를 준비하고 있습니다.</p><button class="retry" id="retry" hidden>다시 시도</button></div>
<script>
const parts=['payload1.txt','payload2.txt','payload3.txt'];
async function boot(){
 const status=document.getElementById('status'),retry=document.getElementById('retry');retry.hidden=true;status.className='';status.textContent='온라인 데이터를 준비하고 있습니다.';
 try{
  const chunks=await Promise.all(parts.map((p,i)=>fetch(`${p}?v=${Date.now()}-${i}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`${p}: ${r.status}`);return r.text()})));
  const b64=chunks.join('').replace(/\s+/g,'');
  const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  if(!('DecompressionStream' in window)) throw new Error('이 브라우저는 온라인 미리보기 압축 해제를 지원하지 않습니다. 최신 Chrome 또는 Samsung Internet을 사용해 주세요.');
  const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  if(!html.includes('PS Radar')||html.length<20000)throw new Error('미리보기 파일 검증에 실패했습니다.');
  document.open();document.write(html);document.close();
 }catch(err){status.className='error';status.textContent=`미리보기를 열지 못했습니다: ${err.message||err}`;retry.hidden=false;}
}
document.getElementById('retry').addEventListener('click',boot);boot();
</script>
</body>
</html>
