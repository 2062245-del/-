name: Build TravelMate v0.5.13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/travelmate-android-v0.5.13.yml'
      - '.ci/travelmate-v0513/v0.5.13.patch'
      - '.ci/travelmate-v0513/TravelMateRegressionTest.java'
  workflow_dispatch:

concurrency:
  group: travelmate-v0513
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: .ci-signing/baro-interpreter.jks
          key: baro-interpreter-release-keystore-v1

      - name: Restore verified v0.5.12 source artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build-src .ci-signing /tmp/v0512
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/2062245-del/-/actions/artifacts/11134871577/zip" \
            -o /tmp/v0512-artifact.zip
          unzip -q /tmp/v0512-artifact.zip -d /tmp/v0512
          test -s /tmp/v0512/TravelMate_Android_v0.5.12_source.zip
          unzip -q /tmp/v0512/TravelMate_Android_v0.5.12_source.zip -d build-src
          grep -q "versionName '0.5.12'" build-src/app/build.gradle
          grep -q 'versionCode 18' build-src/app/build.gradle

      - name: Apply v0.5.13 UX and latency patch
        shell: bash
        run: |
          set -euxo pipefail
          cd build-src
          patch -p1 < ../.ci/travelmate-v0513/v0.5.13.patch

      - name: Translation and verification regression tests
        shell: bash
        run: |
          set -euxo pipefail
          PKG=/tmp/qtest/com/seungho/barointerpreter
          mkdir -p "$PKG"
          cp build-src/app/src/main/java/com/seungho/barointerpreter/TravelTranslationQuality.java "$PKG/"
          cp build-src/app/src/main/java/com/seungho/barointerpreter/TranslationVerification.java "$PKG/"
          cp .ci/travelmate-v0513/TravelMateRegressionTest.java "$PKG/"
          javac -encoding UTF-8 "$PKG/TravelTranslationQuality.java" "$PKG/TranslationVerification.java" "$PKG/TravelMateRegressionTest.java"
          java -cp /tmp/qtest com.seungho.barointerpreter.TravelMateRegressionTest | tee travelmate-regression-test.txt
          grep -q 'TOTAL PASS=8' travelmate-regression-test.txt

      - name: Prepare signing
        shell: bash
        run: |
          set -euxo pipefail
          KEY="$PWD/.ci-signing/baro-interpreter.jks"
          test -s "$KEY"
          echo "BARO_KEYSTORE_PATH=$KEY" >> "$GITHUB_ENV"
          echo "BARO_KEYSTORE_PASSWORD=baro-local-release" >> "$GITHUB_ENV"
          echo "BARO_KEY_ALIAS=baro" >> "$GITHUB_ENV"
          echo "BARO_KEY_PASSWORD=baro-local-release" >> "$GITHUB_ENV"

      - name: Static checks
        shell: bash
        run: |
          set -euxo pipefail
          MAIN=build-src/app/src/main/java/com/seungho/barointerpreter/MainActivity.java
          VERIFY=build-src/app/src/main/java/com/seungho/barointerpreter/TranslationVerification.java
          grep -q 'versionCode 19' build-src/app/build.gradle
          grep -q "versionName '0.5.13'" build-src/app/build.gradle
          grep -q 'showListeningOverlay' "$MAIN"
          grep -q 'startListeningPulse' "$MAIN"
          grep -q 'onRmsChanged' "$MAIN"
          grep -q 'EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS' "$MAIN"
          grep -q 'cachedTranslator' "$MAIN"
          grep -q 'prewarmCurrentPair' "$MAIN"
          grep -q '번역 검증 · 역번역으로 비교' "$MAIN"
          grep -q 'verifyLastTranslation' "$MAIN"
          grep -q 'openExternalTranslationComparison' "$MAIN"
          grep -q 'TranslationVerification.inspect' "$MAIN"
          grep -q 'class TranslationVerification' "$VERIFY"
          grep -q 'com.microsoft.onnxruntime:onnxruntime-android:1.26.0' build-src/app/build.gradle

      - name: Build release APK
        working-directory: build-src
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon :app:assembleRelease

      - name: Verify APK and package source
        shell: bash
        run: |
          set -euxo pipefail
          APK=build-src/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -tq "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -qi '7d411eb878d63e9b30e5a75c65ce1206d195b45a3e5f794955bd78f625b87b85' apk-signature.txt
          "$AAPT" dump badging "$APK" | head -n 25 | tee apk-badging.txt
          grep -q "name='com.seungho.barointerpreter'" apk-badging.txt
          grep -q "versionCode='19'" apk-badging.txt
          grep -q "versionName='0.5.13'" apk-badging.txt
          cp "$APK" TravelMate-v0.5.13-arm64.apk
          (cd build-src && zip -qr ../TravelMate_Android_v0.5.13_source.zip . -x 'app/build/*' '.gradle/*')
          sha256sum TravelMate-v0.5.13-arm64.apk > TravelMate-v0.5.13-arm64.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: TravelMate-v0.5.13-arm64
          path: |
            TravelMate-v0.5.13-arm64.apk
            TravelMate-v0.5.13-arm64.sha256
            TravelMate_Android_v0.5.13_source.zip
            travelmate-regression-test.txt
            apk-signature.txt
            apk-badging.txt
          if-no-files-found: error
          retention-days: 30
