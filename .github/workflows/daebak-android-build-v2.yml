name: Build Daebak Android APK v2

on:
  push:
    branches: [ daebak-apk-build-v2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore verified project ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          files=sorted(Path('daebak-android').glob('chunk_*.b64'))
          s=''.join(p.read_text().strip() for p in files)
          assert len(s)==56860, len(s)
          assert s[30686]=='l', s[30686]
          s=s[:30686]+'p'+s[30687:]
          data=base64.b64decode(s, validate=True)
          digest=hashlib.sha256(data).hexdigest()
          expected='cc9c6fc2018d7903925d519246674acef5dbf799fcc1d24c0d2307b265e596ac'
          assert digest==expected, (digest,expected)
          Path('/tmp/project.zip').write_bytes(data)
          print('Verified project ZIP SHA256:',digest)
          PY
          mkdir -p /tmp/project
          unzip -q /tmp/project.zip -d /tmp/project
          test -f /tmp/project/daebak-generator-android-v1.1/app/build.gradle
          test -f /tmp/project/daebak-generator-android-v1.1/app/src/main/assets/index.html

      - name: Build debug APK
        working-directory: /tmp/project/daebak-generator-android-v1.1
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK=/tmp/project/daebak-generator-android-v1.1/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daebak-generator-v6.3-android-debug
          path: /tmp/project/daebak-generator-android-v1.1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
