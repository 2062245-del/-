name: Build Daebak Android APK v2

on:
  push:
    branches: [ daebak-android-build ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android project payload
        shell: bash
        run: |
          set -euo pipefail
          sed -n '/^[[:space:]]*UEsDB/p' .github/workflows/daebak-android-build.yml | head -n 1 | sed 's/^[[:space:]]*//' > /tmp/daebak-project.b64
          test -s /tmp/daebak-project.b64
          base64 -d /tmp/daebak-project.b64 > /tmp/daebak-project.zip
          mkdir -p /tmp/daebak-src
          unzip -q /tmp/daebak-project.zip -d /tmp/daebak-src
          PROJECT_DIR=$(find /tmp/daebak-src -maxdepth 1 -type d -name 'daebak-generator-android-*' | head -n 1)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/DaebakGenerator-v6.3-android-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daebak-generator-android-apk
          path: DaebakGenerator-v6.3-android-debug.apk
          if-no-files-found: error
