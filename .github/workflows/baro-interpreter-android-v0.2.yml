name: Build Baro Interpreter v0.2 Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baro-interpreter-android-v0.2.yml'
  workflow_dispatch:

concurrency:
  group: baro-interpreter-v0-2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore persistent signing key
        uses: actions/cache@v4
        with:
          path: .ci-signing/baro-interpreter.jks
          key: baro-interpreter-release-keystore-v1

      - name: Prepare source and signing
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/baro-src.b64 <<'BARO_B64'
          
          
          
          
          BARO_B64
          sed 's/^[[:space:]]*//' /tmp/baro-src.b64 | tr -d '\n' | base64 -d > /tmp/baro-src.zip
          rm -rf baro-interpreter
          mkdir -p baro-interpreter
          unzip -q /tmp/baro-src.zip -d baro-interpreter
          mkdir -p .ci-signing
          KEY="$PWD/.ci-signing/baro-interpreter.jks"
          if [ ! -s "$KEY" ]; then
            keytool -genkeypair -v -keystore "$KEY" -storepass baro-local-release -keypass baro-local-release -alias baro -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Baro Interpreter, OU=Android, O=Local, L=Seoul, C=KR"
          fi
          echo "BARO_KEYSTORE_PATH=$KEY" >> "$GITHUB_ENV"
          echo "BARO_KEYSTORE_PASSWORD=baro-local-release" >> "$GITHUB_ENV"
          echo "BARO_KEY_ALIAS=baro" >> "$GITHUB_ENV"
          echo "BARO_KEY_PASSWORD=baro-local-release" >> "$GITHUB_ENV"

      - name: Static source checks
        shell: bash
        run: |
          set -euxo pipefail
          test -s baro-interpreter/app/src/main/java/com/seungho/barointerpreter/MainActivity.java
          grep -q "createOnDeviceSpeechRecognizer" baro-interpreter/app/src/main/java/com/seungho/barointerpreter/MainActivity.java
          grep -q "TranslateLanguage.VIETNAMESE" baro-interpreter/app/src/main/java/com/seungho/barointerpreter/MainActivity.java
          grep -q "versionName '0.2.0'" baro-interpreter/app/build.gradle

      - name: Build release APK
        run: gradle -p baro-interpreter :app:assembleRelease --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=baro-interpreter/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee baro-apk-signature.txt
          "$AAPT" dump badging "$APK" | tee baro-apk-badging.txt
          grep -q "package: name='com.seungho.barointerpreter' versionCode='2' versionName='0.2.0'" baro-apk-badging.txt
          unzip -t "$APK" | tee baro-apk-ziptest.txt
          cp "$APK" BaroInterpreter-v0.2.0.apk
          sha256sum BaroInterpreter-v0.2.0.apk | tee BaroInterpreter-v0.2.0.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BaroInterpreter-v0.2.0
          path: |
            BaroInterpreter-v0.2.0.apk
            BaroInterpreter-v0.2.0.sha256
            baro-apk-signature.txt
            baro-apk-badging.txt
            baro-apk-ziptest.txt
          if-no-files-found: error
          retention-days: 30
