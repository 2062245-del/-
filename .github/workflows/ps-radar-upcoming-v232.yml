name: PS Radar Upcoming Verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ps-radar-upcoming-v232.yml'
permissions:
  contents: write
concurrency:
  group: ps-radar-catalog-relationships
  cancel-in-progress: false
jobs:
  upcoming:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify unreleased concepts and actual launches
        run: node ps-radar/scripts/refresh-upcoming-v232.mjs
      - name: Build compact mobile catalog
        run: node ps-radar/scripts/build-app-catalog-v232.mjs
      - name: Commit verified upcoming data
        run: |
          git add ps-radar/data/store-catalog-v232.json ps-radar/data/catalog-app-v232.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh official upcoming games and actual release verification'
          git pull --rebase origin main
          git push origin main
