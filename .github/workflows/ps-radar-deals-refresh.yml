name: PS Radar Deals Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - 'ps-radar/scripts/fetch-store-deals.mjs'
      - 'ps-radar/scripts/sanitize-deals.mjs'
      - 'ps-radar/scripts/repair-deals-v1742.mjs'
      - 'ps-radar/scripts/hydrate-missing-art.mjs'
      - 'ps-radar/scripts/update-deal-history.mjs'
      - 'ps-radar/scripts/validate-upcoming.mjs'
      - '.github/workflows/ps-radar-deals-refresh.yml'

permissions:
  contents: write

concurrency:
  group: ps-radar-deals-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium

      - name: Collect PS Store deals
        env:
          PSRADAR_MAX_CAMPAIGNS: '8'
          PSRADAR_MAX_PAGES_PER_CAMPAIGN: '60'
          PSRADAR_MAX_TOTAL_PAGES: '160'
          PSRADAR_MAX_EMPTY_STREAK: '5'
          PSRADAR_MIN_SAFE_ITEMS: '20'
          PSRADAR_MIN_PREVIOUS_RATIO: '0.25'
        run: node ps-radar/scripts/fetch-store-deals.mjs

      - name: Crosscheck listing-card prices and artwork
        env:
          PSRADAR_REPAIR_MAX_PAGES: '160'
          PSRADAR_REPAIR_MAX_CAMPAIGN_PAGES: '60'
          PSRADAR_PRICE_TOLERANCE: '2.5'
        run: node ps-radar/scripts/repair-deals-v1742.mjs

      - name: Sanitize titles and artwork matches
        run: node ps-radar/scripts/sanitize-deals.mjs

      - name: Hydrate missing official artwork server-side
        env:
          PSRADAR_ART_MAX_ITEMS: '240'
          PSRADAR_ART_CONCURRENCY: '8'
          PSRADAR_ART_TIMEOUT_MS: '8000'
        run: node ps-radar/scripts/hydrate-missing-art.mjs

      - name: Recheck artwork collisions
        run: node ps-radar/scripts/sanitize-deals.mjs

      - name: Update PS Radar observed price history
        env:
          PSRADAR_PRICE_TOLERANCE: '2.5'
        run: node ps-radar/scripts/update-deal-history.mjs

      - name: Grade upcoming release verification
        run: node ps-radar/scripts/validate-upcoming.mjs

      - name: Validate v17.7 data snapshot
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('ps-radar/data/deals-auto.json','utf8'));
          const h=JSON.parse(fs.readFileSync('ps-radar/data/deal-history.json','utf8'));
          const u=JSON.parse(fs.readFileSync('ps-radar/data/upcoming.json','utf8'));
          if(!p?.health?.safeToMerge) throw new Error('deals snapshot safety flag is false');
          if(!Array.isArray(p.items)||p.items.length<2000) throw new Error(`too few deal items: ${p.items?.length}`);
          if(!h?.items||Number(h.itemCount)<2000) throw new Error(`observed history unexpectedly small: ${h?.itemCount}`);
          if(!u?.verification||!Array.isArray(u.items)||u.items.length<5) throw new Error('upcoming verification missing');
          let validPrices=0,rejectedPrices=0,historyTagged=0,badVisible=0,badCollision=0;
          for(const x of p.items){
            if(!(Number(x.discountPercent)>0)) throw new Error(`invalid discount: ${x.title}`);
            if(!x.storeVerified) throw new Error(`unverified store item: ${x.title}`);
            if(x.imageStatus==='collision-removed' && x.image) badCollision++;
            if(x.radarFirstSeenAt) historyTagged++;
            if(String(x.priceStatus||'').startsWith('rejected')){
              if(x.currentPrice!==null) throw new Error(`rejected price must be hidden: ${x.title}`);
              rejectedPrices++;continue;
            }
            const c=Number(x.currentPrice),o=Number(x.originalPrice),d=Number(x.discountPercent);
            if(!(o>c)||!(c>0)){badVisible++;continue;}
            const implied=(1-c/o)*100;
            if(Math.abs(implied-d)>2.5)badVisible++;
            else validPrices++;
          }
          if(validPrices<2000) throw new Error(`too few crosschecked prices: ${validPrices}`);
          if(badVisible) throw new Error(`visible price math regressions: ${badVisible}`);
          if(badCollision) throw new Error(`collision-removed images still visible: ${badCollision}`);
          if(historyTagged<p.items.length*0.95) throw new Error(`history tags incomplete: ${historyTagged}/${p.items.length}`);
          console.log('v17.7 data QA passed',{
            deals:p.items.length,validPrices,rejectedPrices,historyTagged,
            observedHistory:h.itemCount,newDeals:h.newDealCount,lows:h.lowCount,
            artCandidates:p.health.artHydrationCandidates||0,artFilled:p.health.artHydrationFilled||0,
            upcoming:u.items.length,upcomingVerification:u.verification
          });
          NODE

      - name: Build latest runnable package
        run: |
          rm -rf dist/PS-Radar-latest
          mkdir -p dist/PS-Radar-latest
          cp -R ps-radar dist/PS-Radar-latest/ps-radar
          cat > dist/PS-Radar-latest/PS-Radar-Start.bat <<'BAT'
          @echo off
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0server.ps1"
          BAT
          cat > dist/PS-Radar-latest/server.ps1 <<'POWERSHELL'
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PSScriptRoot 'ps-radar'
          $prefix = 'http://localhost:8765/'
          $listener = New-Object System.Net.HttpListener
          $listener.Prefixes.Add($prefix)
          $listener.Start()
          Start-Process ($prefix + 'ps-radar/')
          Write-Host 'PS Radar is running at http://localhost:8765/ps-radar/'
          Write-Host 'Close this window to stop PS Radar.'
          $mime = @{ '.html'='text/html; charset=utf-8'; '.js'='text/javascript; charset=utf-8'; '.css'='text/css; charset=utf-8'; '.json'='application/json; charset=utf-8'; '.webmanifest'='application/manifest+json; charset=utf-8'; '.png'='image/png'; '.jpg'='image/jpeg'; '.jpeg'='image/jpeg'; '.svg'='image/svg+xml'; '.ico'='image/x-icon'; '.webp'='image/webp' }
          while ($listener.IsListening) {
            $ctx = $listener.GetContext()
            try {
              $rel = [Uri]::UnescapeDataString($ctx.Request.Url.AbsolutePath.TrimStart('/'))
              if ([string]::IsNullOrWhiteSpace($rel)) { $rel = 'ps-radar/index.html' }
              if ($rel -eq 'ps-radar' -or $rel -eq 'ps-radar/') { $rel = 'ps-radar/index.html' }
              if ($rel.StartsWith('ps-radar/')) { $rel = $rel.Substring(9) }
              $target = [IO.Path]::GetFullPath((Join-Path $root $rel))
              $rootFull = [IO.Path]::GetFullPath($root)
              if (-not $target.StartsWith($rootFull, [StringComparison]::OrdinalIgnoreCase)) { throw 'Forbidden' }
              if (Test-Path $target -PathType Container) { $target = Join-Path $target 'index.html' }
              if (-not (Test-Path $target -PathType Leaf)) {
                $ctx.Response.StatusCode = 404
                $bytes = [Text.Encoding]::UTF8.GetBytes('Not Found')
              } else {
                $ext = [IO.Path]::GetExtension($target).ToLowerInvariant()
                if ($mime.ContainsKey($ext)) { $ctx.Response.ContentType = $mime[$ext] }
                $bytes = [IO.File]::ReadAllBytes($target)
              }
              $ctx.Response.ContentLength64 = $bytes.Length
              $ctx.Response.OutputStream.Write($bytes,0,$bytes.Length)
            } catch { $ctx.Response.StatusCode = 500 } finally { $ctx.Response.OutputStream.Close() }
          }
          POWERSHELL
          cat > dist/PS-Radar-latest/README.txt <<'TXT'
          PS Radar v17.7.0 최종 실행 패키지
          1. 압축을 풉니다.
          2. PS-Radar-Start.bat 를 더블클릭합니다.
          3. 브라우저에서 PS Radar가 자동으로 열립니다.
          4. 종료하려면 실행 중인 명령창을 닫습니다.
          TXT
          python - <<'PY'
          import shutil
          shutil.make_archive('PS-Radar-v17.7.0-Latest', 'zip', 'dist/PS-Radar-latest')
          PY

      - name: Upload latest runnable package
        uses: actions/upload-artifact@v4
        with:
          name: PS-Radar-v17.7.0-Latest
          path: PS-Radar-v17.7.0-Latest.zip
          if-no-files-found: error
          retention-days: 30

      - name: Commit refreshed v17.7 data
        run: |
          git add ps-radar/data/deals-auto.json ps-radar/data/deal-history.json ps-radar/data/upcoming.json
          if git diff --cached --quiet; then
            echo 'No data changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh PS Radar v17.7 verified data'
          git push origin main
