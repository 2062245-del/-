name: Build Baro Interpreter v0.4 Android APK

on:
  push:
    branches: [main]
    paths:
      - '.ci/baro-v04-chunk-*.b64'
      - '.github/workflows/baro-interpreter-android-v0.4.yml'
  workflow_dispatch:

concurrency:
  group: baro-interpreter-v04
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: .ci-signing/baro-interpreter.jks
          key: baro-interpreter-release-keystore-v1

      - name: Prepare source and signing
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build-src .ci-signing
          cat .ci/baro-v04-chunk-*.b64 | base64 --decode > /tmp/baro-v04.zip
          echo '011547dc03d6f0308a5deaf72aa5705a4290470a93a6e40df5d72b16d6a24028  /tmp/baro-v04.zip' | sha256sum -c -
          unzip -q /tmp/baro-v04.zip -d build-src
          KEY="$PWD/.ci-signing/baro-interpreter.jks"
          if [ ! -s "$KEY" ]; then
            keytool -genkeypair -v -keystore "$KEY" -storepass baro-local-release -keypass baro-local-release -alias baro -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Baro Interpreter, OU=Android, O=Local, L=Seoul, C=KR"
          fi
          echo "BARO_KEYSTORE_PATH=$KEY" >> "$GITHUB_ENV"
          echo "BARO_KEYSTORE_PASSWORD=baro-local-release" >> "$GITHUB_ENV"
          echo "BARO_KEY_ALIAS=baro" >> "$GITHUB_ENV"
          echo "BARO_KEY_PASSWORD=baro-local-release" >> "$GITHUB_ENV"

      - name: Static quality checks
        shell: bash
        run: |
          set -euxo pipefail
          SRC=build-src/app/src/main/java/com/seungho/barointerpreter/MainActivity.java
          test -s "$SRC"
          grep -q "versionName '0.4.0'" build-src/app/build.gradle
          grep -q 'Xin chào' "$SRC"
          grep -q 'showVoicePicker' "$SRC"
          grep -q 'getOfflineVoices' "$SRC"
          grep -q 'phrasebook' "$SRC"
          grep -q 'checkRecognitionSupport' "$SRC"

      - name: Build release APK
        working-directory: build-src
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=build-src/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -q "Signer #1 certificate SHA-256 digest: 7d411eb878d63e9b30e5a75c65ce1206d195b45a3e5f794955bd78f625b87b85" apk-signature.txt
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.seungho.barointerpreter' versionCode='5' versionName='0.4.0'" apk-badging.txt
          unzip -t "$APK" | tee apk-ziptest.txt
          cp "$APK" BaroInterpreter-v0.4.0.apk
          sha256sum BaroInterpreter-v0.4.0.apk | tee BaroInterpreter-v0.4.0.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BaroInterpreter-v0.4.0
          path: |
            BaroInterpreter-v0.4.0.apk
            BaroInterpreter-v0.4.0.sha256
            apk-signature.txt
            apk-badging.txt
            apk-ziptest.txt
          if-no-files-found: error
          retention-days: 30
