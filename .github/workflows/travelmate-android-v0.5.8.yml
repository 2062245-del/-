name: Build TravelMate v0.5.8

on:
  push:
    branches: [main]
    paths:
      - '.ci/travelmate-v058.patch'
      - '.github/workflows/travelmate-android-v0.5.8.yml'
  workflow_dispatch:

concurrency:
  group: travelmate-v058
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: .ci-signing/baro-interpreter.jks
          key: baro-interpreter-release-keystore-v1

      - name: Restore verified v0.5.7 source artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifact057 build-src .ci-signing
          gh run download 36659893571 --repo 2062245-del/- --name TravelMate-v0.5.7-arm64 --dir artifact057
          test -s artifact057/TravelMate_Android_v0.5.7_source.zip
          echo 'd7fd910c3e545f2fe325d251b6246ca4c79dce590e6f5baa995a2d7a6736be92  artifact057/TravelMate_Android_v0.5.7_source.zip' | sha256sum -c -
          unzip -q artifact057/TravelMate_Android_v0.5.7_source.zip -d build-src

      - name: Apply v0.5.8 UX and TTS latency patch
        shell: bash
        run: |
          set -euxo pipefail
          patch -d build-src -p1 --batch < .ci/travelmate-v058.patch

      - name: Prepare signing
        shell: bash
        run: |
          set -euxo pipefail
          KEY="$PWD/.ci-signing/baro-interpreter.jks"
          test -s "$KEY"
          echo "BARO_KEYSTORE_PATH=$KEY" >> "$GITHUB_ENV"
          echo "BARO_KEYSTORE_PASSWORD=baro-local-release" >> "$GITHUB_ENV"
          echo "BARO_KEY_ALIAS=baro" >> "$GITHUB_ENV"
          echo "BARO_KEY_PASSWORD=baro-local-release" >> "$GITHUB_ENV"

      - name: Static checks
        shell: bash
        run: |
          set -euxo pipefail
          grep -q "versionCode 14" build-src/app/build.gradle
          grep -q "versionName '0.5.8'" build-src/app/build.gradle
          grep -q "com.microsoft.onnxruntime:onnxruntime-android:1.26.0" build-src/app/build.gradle
          ! grep -q "sherpa-onnx" build-src/app/build.gradle
          grep -q 'prewarm()' build-src/app/src/main/java/com/seungho/barointerpreter/NeuralTtsClient.java
          grep -q '300, TimeUnit.SECONDS' build-src/app/src/main/java/com/seungho/barointerpreter/NeuralTtsEngine.java
          grep -q 'audioCache' build-src/app/src/main/java/com/seungho/barointerpreter/NeuralTtsEngine.java
          grep -q '빠른 도구' build-src/app/src/main/java/com/seungho/barointerpreter/MainActivity.java
          grep -q '한국어 발음(참고)' build-src/app/src/main/java/com/seungho/barointerpreter/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          s=Path('build-src/app/src/main/java/com/seungho/barointerpreter/MainActivity.java').read_text()
          assert 'resultView.setMinHeight(dp(60))' not in s
          assert s.index('section("빠른 도구"') < s.index('rightTalkButton = primaryButton')
          assert s.index('pronunciationView = text') < s.index('resultActions = row')
          print('UI order checks passed')
          PY

      - name: Build release APK
        working-directory: build-src
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK and package source
        shell: bash
        run: |
          set -euxo pipefail
          APK=build-src/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -q "Signer #1 certificate SHA-256 digest: 7d411eb878d63e9b30e5a75c65ce1206d195b45a3e5f794955bd78f625b87b85" apk-signature.txt
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.seungho.barointerpreter' versionCode='14' versionName='0.5.8'" apk-badging.txt
          grep -q "application-label:'여행메이트'" apk-badging.txt
          unzip -t "$APK" | tee apk-ziptest.txt
          cp "$APK" TravelMate-v0.5.8-arm64.apk
          sha256sum TravelMate-v0.5.8-arm64.apk | tee TravelMate-v0.5.8-arm64.sha256
          (cd build-src && zip -qr ../TravelMate_Android_v0.5.8_source.zip . -x 'app/build/*' '.gradle/*' 'build/*')
          test -s TravelMate_Android_v0.5.8_source.zip
          ls -lh TravelMate-v0.5.8-arm64.apk TravelMate_Android_v0.5.8_source.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TravelMate-v0.5.8-arm64
          path: |
            TravelMate-v0.5.8-arm64.apk
            TravelMate-v0.5.8-arm64.sha256
            TravelMate_Android_v0.5.8_source.zip
            apk-signature.txt
            apk-badging.txt
            apk-ziptest.txt
          if-no-files-found: error
          retention-days: 30
