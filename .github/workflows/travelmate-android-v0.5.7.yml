name: Build TravelMate v0.5.7

on:
  push:
    branches: [main]
    paths:
      - '.ci/travelmate-v057-transform.py'
      - '.ci/travelmate-v057-pronunciation.java.txt'
      - '.github/workflows/travelmate-android-v0.5.7.yml'
  workflow_dispatch:

concurrency:
  group: travelmate-v057
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: .ci-signing/baro-interpreter.jks
          key: baro-interpreter-release-keystore-v1

      - name: Restore verified v0.5.3 source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build-src .ci-signing
          cat .ci/travelmate-v053-chunk-*.b64 | base64 --decode > /tmp/travelmate-v053.zip
          echo 'aed74d3cbea22ec183aa48f877a95b0e31a756c55805247d5b538fd8e1d03dec  /tmp/travelmate-v053.zip' | sha256sum -c -
          unzip -q /tmp/travelmate-v053.zip -d build-src

      - name: Apply v0.5.4 isolation baseline
        shell: bash
        run: |
          set -euxo pipefail
          cp .ci/travelmate-v054/NeuralTtsClient.java build-src/app/src/main/java/com/seungho/barointerpreter/NeuralTtsClient.java
          cp .ci/travelmate-v054/NeuralTtsService.java build-src/app/src/main/java/com/seungho/barointerpreter/NeuralTtsService.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build-src/app/build.gradle')
          s=p.read_text().replace('versionCode 9','versionCode 10').replace("versionName '0.5.3'","versionName '0.5.4'")
          p.write_text(s)
          p=Path('build-src/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          anchor='''        android:theme="@style/AppTheme"\n        android:usesCleartextTraffic="false">\n'''
          repl='''        android:theme="@style/AppTheme"\n        android:usesCleartextTraffic="false">\n        <service\n            android:name=".NeuralTtsService"\n            android:exported="false"\n            android:process=":neural_tts"\n            android:stopWithTask="true" />\n'''
          if 'android:process=":neural_tts"' not in s:
              if anchor not in s: raise SystemExit('manifest anchor missing')
              s=s.replace(anchor,repl)
          p.write_text(s)
          p=Path('build-src/app/src/main/java/com/seungho/barointerpreter/MainActivity.java')
          s=p.read_text()
          s=s.replace('private NeuralTtsEngine neuralTts;','private NeuralTtsClient neuralTts;')
          s=s.replace('neuralTts = new NeuralTtsEngine(this);','neuralTts = new NeuralTtsClient(this);')
          old='''        neuralStatusView.setText(neuralTts.isReady()\n                ? "● AI 음성 준비됨 · 여성 A / 남성"\n                : "● AI 음성팩 설치됨 · 사용할 때 자동 준비");\n        neuralStatusView.setTextColor(neuralTts.isReady() ? GREEN : CYAN);\n'''
          new='''        if (neuralTts.isSafeMode()) {\n            neuralStatusView.setText("△ AI 음성 안전모드 · 기본 음성 사용 중");\n            neuralStatusView.setTextColor(AMBER);\n        } else {\n            neuralStatusView.setText(neuralTts.isReady()\n                    ? "● AI 음성 준비됨 · 여성 A / 남성"\n                    : "● AI 음성팩 설치됨 · 사용할 때 자동 준비");\n            neuralStatusView.setTextColor(neuralTts.isReady() ? GREEN : CYAN);\n        }\n'''
          if old not in s: raise SystemExit('neural status block missing')
          s=s.replace(old,new)
          s=s.replace('new NeuralTtsEngine.ModelDownloadCallback()','new NeuralTtsClient.ModelDownloadCallback()')
          s=s.replace('if(message.contains("실패")) systemSpeak(text,language);','if(message.contains("실패") || message.contains("안전모드")) systemSpeak(text,language);')
          p.write_text(s)
          p=Path('build-src/app/src/main/java/com/seungho/barointerpreter/CrashDiagnostics.java')
          s=p.read_text()
          old='''                        sb.append(new SimpleDateFormat("MM-dd HH:mm:ss", Locale.KOREA).format(new Date(info.getTimestamp())))\n                                .append(" · ").append(reasonName(info.getReason()));\n                        String d = info.getDescription();\n'''
          new='''                        sb.append(new SimpleDateFormat("MM-dd HH:mm:ss", Locale.KOREA).format(new Date(info.getTimestamp())))\n                                .append(" · ").append(reasonName(info.getReason()));\n                        String process = info.getProcessName();\n                        if (process != null && !process.trim().isEmpty()) sb.append(" · 프로세스 ").append(process.trim());\n                        if (info.getPss() > 0) sb.append(" · PSS ").append(info.getPss() / 1024).append("MB");\n                        if (info.getRss() > 0) sb.append(" · RSS ").append(info.getRss() / 1024).append("MB");\n                        String d = info.getDescription();\n'''
          if old not in s: raise SystemExit('diagnostics block missing')
          s=s.replace(old,new)
          p.write_text(s)
          PY

      - name: Apply v0.5.5 baseline
        shell: bash
        run: |
          set -uxo pipefail
          patch -d build-src -p1 --batch --forward < .ci/travelmate-v055.patch || true
          cp .ci/travelmate-v055/NeuralTtsClient.java build-src/app/src/main/java/com/seungho/barointerpreter/NeuralTtsClient.java

      - name: Apply v0.5.6 ONNX Runtime baseline
        shell: bash
        run: |
          set -euxo pipefail
          base64 --decode .ci/travelmate-v056.patch.gz.b64 | gzip -dc > /tmp/travelmate-v056.patch
          echo 'cd96520a6ce03763e789e39a83e2cf4e49a856df865f0cd4fb8c6795ecded9f5  /tmp/travelmate-v056.patch' | sha256sum -c -
          patch -d build-src -p1 --batch < /tmp/travelmate-v056.patch
          sed -i -E 's/minSdk(Version)?[[:space:]]+23/minSdk 24/' build-src/app/build.gradle

      - name: Apply v0.5.7 UX and pronunciation
        shell: bash
        run: |
          set -euxo pipefail
          python3 .ci/travelmate-v057-transform.py

      - name: Prepare signing
        shell: bash
        run: |
          set -euxo pipefail
          KEY="$PWD/.ci-signing/baro-interpreter.jks"
          test -s "$KEY"
          echo "BARO_KEYSTORE_PATH=$KEY" >> "$GITHUB_ENV"
          echo "BARO_KEYSTORE_PASSWORD=baro-local-release" >> "$GITHUB_ENV"
          echo "BARO_KEY_ALIAS=baro" >> "$GITHUB_ENV"
          echo "BARO_KEY_PASSWORD=baro-local-release" >> "$GITHUB_ENV"

      - name: Static checks
        shell: bash
        run: |
          set -euxo pipefail
          grep -q "versionCode 13" build-src/app/build.gradle
          grep -q "versionName '0.5.7'" build-src/app/build.gradle
          grep -Eq "minSdk(Version)?[[:space:]]+24|minSdk[[:space:]]+24" build-src/app/build.gradle
          grep -q "com.microsoft.onnxruntime:onnxruntime-android:1.26.0" build-src/app/build.gradle
          ! grep -q "sherpa-onnx" build-src/app/build.gradle
          grep -q 'android:process=":neural_tts"' build-src/app/src/main/AndroidManifest.xml
          grep -q '한국어 발음(참고)' build-src/app/src/main/java/com/seungho/barointerpreter/MainActivity.java
          grep -q 'case "xin chào": return "씬 짜오"' build-src/app/src/main/java/com/seungho/barointerpreter/MainActivity.java
          grep -q '가격 환산·내 지갑을 가장 먼저 꺼냅니다' build-src/app/src/main/java/com/seungho/barointerpreter/MainActivity.java

      - name: Build release APK
        working-directory: build-src
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK and package source
        shell: bash
        run: |
          set -euxo pipefail
          APK=build-src/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -q "Signer #1 certificate SHA-256 digest: 7d411eb878d63e9b30e5a75c65ce1206d195b45a3e5f794955bd78f625b87b85" apk-signature.txt
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.seungho.barointerpreter' versionCode='13' versionName='0.5.7'" apk-badging.txt
          grep -q "application-label:'여행메이트'" apk-badging.txt
          unzip -t "$APK" | tee apk-ziptest.txt
          cp "$APK" TravelMate-v0.5.7-arm64.apk
          sha256sum TravelMate-v0.5.7-arm64.apk | tee TravelMate-v0.5.7-arm64.sha256
          (cd build-src && zip -qr ../TravelMate_Android_v0.5.7_source.zip . -x 'app/build/*' '.gradle/*')
          ls -lh TravelMate-v0.5.7-arm64.apk TravelMate_Android_v0.5.7_source.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TravelMate-v0.5.7-arm64
          path: |
            TravelMate-v0.5.7-arm64.apk
            TravelMate-v0.5.7-arm64.sha256
            TravelMate_Android_v0.5.7_source.zip
            apk-signature.txt
            apk-badging.txt
            apk-ziptest.txt
          if-no-files-found: error
          retention-days: 30
