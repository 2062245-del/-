name: Build PS Radar v17.7 Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'ps-radar/**'
      - '.github/workflows/ps-radar-android-v174.yml'
  workflow_dispatch:

concurrency:
  group: ps-radar-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PSRADAR_KEYSTORE_B64: ${{ secrets.PSRADAR_KEYSTORE_B64 }}
      PSRADAR_KEYSTORE_PASSWORD: ${{ secrets.PSRADAR_KEYSTORE_PASSWORD }}
      PSRADAR_KEY_ALIAS: ${{ secrets.PSRADAR_KEY_ALIAS }}
      PSRADAR_KEY_PASSWORD: ${{ secrets.PSRADAR_KEY_PASSWORD }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate PS Radar v17.7 final code
        shell: bash
        run: |
          set -euxo pipefail
          for f in ps-radar/app.js ps-radar/ui-v13.js ps-radar/catalog-v14.js ps-radar/deals-v16.js ps-radar/mobile-v174.js ps-radar/mobile-v1741.js ps-radar/foundation-v175.js ps-radar/ux-v176.js ps-radar/content-v177.js; do node --check "$f"; done
          for f in ps-radar/scripts/update-deal-history.mjs ps-radar/scripts/hydrate-missing-art.mjs ps-radar/scripts/validate-upcoming.mjs; do node --check "$f"; done
          test -s ps-radar/foundation-v175.css
          test -s ps-radar/ux-v176.css
          test -s ps-radar/content-v177.css
          node - <<'NODE'
          const fs=require('fs');
          const index=fs.readFileSync('ps-radar/index.html','utf8');
          const ux=fs.readFileSync('ps-radar/ux-v176.js','utf8');
          const content=fs.readFileSync('ps-radar/content-v177.js','utf8');
          const foundation=fs.readFileSync('ps-radar/foundation-v175.js','utf8');
          const main=fs.readFileSync('ps-radar/android/MainActivity.java','utf8');
          const worker=fs.readFileSync('ps-radar/android/DealWatchWorker.java','utf8');
          const deals=JSON.parse(fs.readFileSync('ps-radar/data/deals-auto.json','utf8'));
          const upcoming=JSON.parse(fs.readFileSync('ps-radar/data/upcoming.json','utf8'));
          const nav=(index.match(/class="navbtn/g)||[]).length;
          if(nav!==5) throw new Error(`expected 5 bottom tabs, found ${nav}`);
          for(const token of ['foundation-v175.js','ux-v176.js','content-v177.js','content-v177.css']) if(!index.includes(token)) throw new Error(`final index missing ${token}`);
          for(const token of ['오늘의 변화','지금 볼 게임','이번 주 PlayStation','가격알림','보유게임','최근 본']) if(!ux.includes(token)) throw new Error(`v17.6 regression ${token}`);
          for(const token of ['오늘 새 할인','PS Radar 관측 최저','할인 종료 임박','PS Plus 최근 추가','무료 · 체험 가능','1만원 이하 추천','지금 사기','기다려도 됨','출시 캘린더','출시 알림']) if(!content.includes(token)) throw new Error(`v17.7 content missing ${token}`);
          for(const token of ['raw.githubusercontent.com','__PSRADAR_ANDROID_BACK__','syncNativeWatchlist']) if(!foundation.includes(token)) throw new Error(`v17.5 regression ${token}`);
          for(const token of ['syncWatchlist','syncReleaseWatchlist','enableNativeNotifications','PeriodicWorkRequest']) if(!main.includes(token)) throw new Error(`native shell missing ${token}`);
          for(const token of ['UPCOMING_URL','RELEASE_WATCHLIST_KEY','checkReleaseAlerts','notifyChange']) if(!worker.includes(token)) throw new Error(`native watcher missing ${token}`);
          if(!Array.isArray(deals.items)||deals.items.length<2000) throw new Error('deals dataset unexpectedly small');
          if(!Array.isArray(upcoming.items)||upcoming.items.length<5) throw new Error('upcoming dataset unexpectedly small');
          let bad=0;
          for(const x of deals.items){
            if(String(x.priceStatus||'').startsWith('rejected'))continue;
            const c=Number(x.currentPrice),o=Number(x.originalPrice),d=Number(x.discountPercent);
            if(c>0&&o>c&&d>0&&Math.abs((1-c/o)*100-d)>2.5)bad++;
          }
          if(bad)throw new Error(`price math regressions visible: ${bad}`);
          console.log(`v17.7 static QA passed: nav=${nav}, deals=${deals.items.length}, upcoming=${upcoming.items.length}`);
          NODE

      - name: Generate Android wrapper project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/java/com/seungho/psradar app/src/main/assets/ps-radar app/src/main/res/drawable app/src/main/res/values app/src/main/res/xml
          cp -R ps-radar/. app/src/main/assets/ps-radar/
          rm -rf app/src/main/assets/ps-radar/scripts app/src/main/assets/ps-radar/android
          cp ps-radar/android/MainActivity.java app/src/main/java/com/seungho/psradar/MainActivity.java
          cp ps-radar/android/DealWatchWorker.java app/src/main/java/com/seungho/psradar/DealWatchWorker.java

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'PSRadar'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          def releaseKeystore = System.getenv('PSRADAR_KEYSTORE_PATH')
          android {
              namespace 'com.seungho.psradar'
              compileSdk 35
              defaultConfig { applicationId 'com.seungho.psradar'; minSdk 26; targetSdk 35; versionCode 17700; versionName '17.7.0' }
              signingConfigs {
                  if (releaseKeystore) {
                      release {
                          storeFile file(releaseKeystore)
                          storePassword System.getenv('PSRADAR_KEYSTORE_PASSWORD')
                          keyAlias System.getenv('PSRADAR_KEY_ALIAS')
                          keyPassword System.getenv('PSRADAR_KEY_PASSWORD')
                      }
                  }
              }
              buildTypes {
                  debug { applicationIdSuffix ''; versionNameSuffix '' }
                  release { minifyEnabled false; if (releaseKeystore) signingConfig signingConfigs.release }
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
              implementation 'androidx.core:core:1.15.0'
              implementation 'androidx.work:work-runtime:2.10.0'
          }
          EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:windowLightStatusBar">false</item><item name="android:statusBarColor">#0B1020</item><item name="android:navigationBarColor">#0B1020</item><item name="android:windowActionModeOverlay">true</item><item name="android:windowNoTitle">true</item></style></resources>
          EOF
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#0B1020" android:pathData="M0,0h108v108h-108z"/><path android:fillColor="#1264E6" android:pathData="M54,10a44,44 0,1 0,0 88a44,44 0,1 0,0 -88"/><path android:fillColor="#FFFFFF" android:pathData="M33,31h26c11.6,0 20,7.2 20,18.4c0,11.5 -8.4,18.6 -20,18.6H49v12H33V31zm16,13v11h9c3.6,0 5.8,-2.1 5.8,-5.5S61.6,44 58,44h-9z"/><path android:fillColor="#7ED7FF" android:pathData="M66,69l10,0l0,10l-10,0z"/></vector>
          EOF
          cat > app/src/main/res/xml/network_security_config.xml <<'EOF'
          <network-security-config><base-config cleartextTrafficPermitted="false" /></network-security-config>
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><application android:allowBackup="true" android:label="PS Radar" android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher" android:theme="@style/AppTheme" android:hardwareAccelerated="true" android:networkSecurityConfig="@xml/network_security_config" android:usesCleartextTraffic="false"><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="unspecified"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF

      - name: Validate bundled final assets
        shell: bash
        run: |
          set -euxo pipefail
          for f in index.html foundation-v175.js foundation-v175.css ux-v176.js ux-v176.css content-v177.js content-v177.css data/deals-auto.json data/upcoming.json; do test -f "app/src/main/assets/ps-radar/$f"; done
          test -f app/src/main/java/com/seungho/psradar/MainActivity.java
          test -f app/src/main/java/com/seungho/psradar/DealWatchWorker.java
          ! test -d app/src/main/assets/ps-radar/android
          grep -q 'syncReleaseWatchlist' app/src/main/java/com/seungho/psradar/MainActivity.java
          grep -q 'checkReleaseAlerts' app/src/main/java/com/seungho/psradar/DealWatchWorker.java

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          if [ -n "${PSRADAR_KEYSTORE_B64:-}" ] && [ -n "${PSRADAR_KEYSTORE_PASSWORD:-}" ] && [ -n "${PSRADAR_KEY_ALIAS:-}" ] && [ -n "${PSRADAR_KEY_PASSWORD:-}" ]; then
            echo "$PSRADAR_KEYSTORE_B64" | base64 --decode > "$PWD/psradar-release.jks"
            export PSRADAR_KEYSTORE_PATH="$PWD/psradar-release.jks"
            gradle :app:assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk final.apk
            echo release > signing-mode.txt
          else
            gradle :app:assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk final.apk
            echo debug > signing-mode.txt
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=final.apk
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.seungho.psradar' versionCode='17700' versionName='17.7.0'" apk-badging.txt
          cp "$APK" "PS-Radar-v17.7.0-Final.apk"
          sha256sum "PS-Radar-v17.7.0-Final.apk" | tee PS-Radar-v17.7.0-Final.sha256
          echo "Signing mode: $(cat signing-mode.txt)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PS-Radar-v17.7.0-Final
          path: |
            PS-Radar-v17.7.0-Final.apk
            PS-Radar-v17.7.0-Final.sha256
            signing-mode.txt
          if-no-files-found: error
          retention-days: 30
