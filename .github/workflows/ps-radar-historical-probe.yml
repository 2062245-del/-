name: PS Radar Historical Source Probe

on:
  push:
    branches: [ps-radar-historical-probe]
    paths:
      - 'ps-radar/scripts/probe-historical-sources.mjs'
      - '.github/workflows/ps-radar-historical-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ps-radar-historical-probe
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Probe public historical sources
        run: node ps-radar/scripts/probe-historical-sources.mjs
      - name: Commit probe report
        run: |
          git add ps-radar/data/historical-source-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'ps-radar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Record PS Radar historical source probe'
          git pull --rebase origin ps-radar-historical-probe
          git push origin ps-radar-historical-probe
