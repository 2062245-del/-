name: Build Today Codi APK

on:
  push:
    branches:
      - todays-codi-apk-build
    paths:
      - 'todays-codi-apk/build-trigger.txt'
      - '.github/workflows/todays-codi-apk.yml'

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_COMPILE_SDK: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: todays-codi-apk
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp todays-codi-apk/app/build/outputs/apk/debug/app-debug.apk "오늘의 코디.apk"
          ls -lh "오늘의 코디.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: today-codi-apk
          path: 오늘의 코디.apk
          if-no-files-found: error
          retention-days: 14
