name: Generate Baro Neural TTS Preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baro-neural-tts-preview.yml'
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sherpa-onnx soundfile numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download Supertonic 3 INT8 model
        run: |
          curl -L --retry 3 -o supertonic.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-supertonic-3-tts-int8-2026-05-11.tar.bz2
          tar xf supertonic.tar.bz2
          test -s sherpa-onnx-supertonic-3-tts-int8-2026-05-11/vector_estimator.int8.onnx

      - name: Generate preview voices
        shell: bash
        run: |
          cat > generate_preview.py <<'PY'
          import os
          import sherpa_onnx
          import soundfile as sf

          model_dir = 'sherpa-onnx-supertonic-3-tts-int8-2026-05-11'
          config = sherpa_onnx.OfflineTtsConfig(
              model=sherpa_onnx.OfflineTtsModelConfig(
                  supertonic=sherpa_onnx.OfflineTtsSupertonicModelConfig(
                      duration_predictor=f'{model_dir}/duration_predictor.int8.onnx',
                      text_encoder=f'{model_dir}/text_encoder.int8.onnx',
                      vector_estimator=f'{model_dir}/vector_estimator.int8.onnx',
                      vocoder=f'{model_dir}/vocoder.int8.onnx',
                      tts_json=f'{model_dir}/tts.json',
                      unicode_indexer=f'{model_dir}/unicode_indexer.bin',
                      voice_style=f'{model_dir}/voice.bin',
                  ),
                  debug=False,
                  num_threads=2,
                  provider='cpu',
              ),
          )
          tts = sherpa_onnx.OfflineTts(config)
          os.makedirs('preview', exist_ok=True)

          texts = {
              'ko': '안녕하세요. 만나서 반갑습니다. 무엇을 도와드릴까요?',
              'en': 'Hello. Nice to meet you. How can I help you?',
              'vi': 'Xin chào. Rất vui được gặp bạn. Tôi có thể giúp gì cho bạn?',
          }
          speakers = [('A', 0), ('B', 4), ('C', 7)]

          for label, sid in speakers:
              for lang, text in texts.items():
                  gen = sherpa_onnx.GenerationConfig()
                  gen.sid = sid
                  gen.num_steps = 8
                  gen.speed = 1.0
                  gen.extra['lang'] = lang
                  audio = tts.generate(text, gen)
                  wav = f'preview/{label}_{lang}.wav'
                  sf.write(wav, audio.samples, samplerate=audio.sample_rate, subtype='PCM_16')
                  print(wav, audio.sample_rate, len(audio.samples))
          PY
          python generate_preview.py

      - name: Convert to MP3 and make listening guide
        shell: bash
        run: |
          for f in preview/*.wav; do
            ffmpeg -hide_banner -loglevel error -y -i "$f" -codec:a libmp3lame -b:a 192k "${f%.wav}.mp3"
          done
          cat > preview/README.txt <<'EOF'
          바로통역 Neural TTS 품질 테스트 - Supertonic 3 INT8

          A / B / C = 서로 다른 Neural Voice 후보
          ko = 한국어
          en = 영어
          vi = 베트남어

          테스트 문장
          한국어: 안녕하세요. 만나서 반갑습니다. 무엇을 도와드릴까요?
          영어: Hello. Nice to meet you. How can I help you?
          베트남어: Xin chào. Rất vui được gặp bạn. Tôi có thể giúp gì cho bạn?

          A, B, C 중 가장 자연스러운 목소리를 선택해 주세요.
          최종 앱에서는 선택된 Voice를 한국어/영어/베트남어 공통 기본 음성으로 적용할 수 있습니다.
          EOF

      - name: Upload preview samples
        uses: actions/upload-artifact@v4
        with:
          name: Baro-Neural-TTS-Preview-Supertonic3
          path: preview/
          if-no-files-found: error
          retention-days: 30
