name: Build Daebak V7 Final APK

on:
  push:
    branches: [ daebak-v7-final-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore verified base project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          files=sorted(Path('daebak-android').glob('chunk_*.b64'))
          s=''.join(p.read_text().strip() for p in files)
          assert len(s)==56860, len(s)
          assert s[30686]=='l', s[30686]
          s=s[:30686]+'p'+s[30687:]
          data=base64.b64decode(s, validate=True)
          digest=hashlib.sha256(data).hexdigest()
          expected='cc9c6fc2018d7903925d519246674acef5dbf799fcc1d24c0d2307b265e596ac'
          assert digest==expected, (digest,expected)
          Path('/tmp/base-project.zip').write_bytes(data)
          print('Base ZIP SHA256:',digest)
          PY
          mkdir -p /tmp/project
          unzip -q /tmp/base-project.zip -d /tmp/project
          test -f /tmp/project/daebak-generator-android-v1.1/app/build.gradle

      - name: Apply V7 final patch and package conflict hotfix
        shell: bash
        run: |
          cat daebak-final/chunks/v7patch_*.b64 | base64 -d | gzip -d > /tmp/v7.patch
          test $(wc -c < /tmp/v7.patch) -gt 50000
          cd /tmp/project/daebak-generator-android-v1.1
          patch -p1 < /tmp/v7.patch
          sed -i "s/applicationId 'com.daebak.generator'/applicationId 'com.daebak.generator.v7'/" app/build.gradle
          sed -i "s/versionCode 4/versionCode 5/" app/build.gradle
          sed -i "s/versionName '7.0-android.1'/versionName '7.0-android.2'/" app/build.gradle
          sed -i 's/android:label="대박 생성기"/android:label="대박 생성기 V7"/' app/src/main/AndroidManifest.xml
          grep -q "applicationId 'com.daebak.generator.v7'" app/build.gradle
          grep -q "7.0-android.2" app/build.gradle
          grep -q "대박 생성기 V7" app/src/main/AndroidManifest.xml
          grep -q "대박 생성기 V7.0" app/src/main/assets/index.html
          test -f app/src/main/java/com/daebak/generator/ReminderReceiver.java

      - name: Build debug APK
        working-directory: /tmp/project/daebak-generator-android-v1.1
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK=/tmp/project/daebak-generator-android-v1.1/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/index.html'
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daebak-generator-v7.0-android-final-installfix
          path: /tmp/project/daebak-generator-android-v1.1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
