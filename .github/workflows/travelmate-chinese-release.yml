name: Build signed TravelMate v0.5.24 personal and shared APKs
on:
  pull_request:
    branches: [travelmate-v0513-a-build]
    paths: ['.github/workflows/travelmate-chinese-release.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: travelmate-chinese-release
  cancel-in-progress: true
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        variant: [Personal, Share]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      GH_TOKEN: ${{ github.token }}
      RELEASE_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Restore original release signing key
        uses: actions/cache@v4
        with:
          path: .ci-signing/baro-interpreter.jks
          key: baro-interpreter-release-keystore-v1
      - name: Prepare signing
        run: |
          set -euo pipefail
          test -s .ci-signing/baro-interpreter.jks
          echo "BARO_KEYSTORE_PATH=$PWD/.ci-signing/baro-interpreter.jks" >> "$GITHUB_ENV"
          echo "BARO_KEYSTORE_PASSWORD=baro-local-release" >> "$GITHUB_ENV"
          echo "BARO_KEY_ALIAS=baro" >> "$GITHUB_ENV"
          echo "BARO_KEY_PASSWORD=baro-local-release" >> "$GITHUB_ENV"
      - name: Restore verified shared v0.5.23 project
        run: |
          set -euo pipefail
          mkdir /tmp/shared23 build-src
          curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/2062245-del/-/actions/artifacts/11236001804/zip' -o /tmp/shared23.zip
          echo 'b749b94bf78784a4b27807e9ca1b9ee6db0465575948f166ce46a41348f1d24b  /tmp/shared23.zip' | sha256sum -c -
          unzip -q /tmp/shared23.zip -d /tmp/shared23
          unzip -q /tmp/shared23/TravelMate_Android_v0.5.23-Share_source.zip -d build-src
      - name: Apply Chinese voice changes and pinned runtime
        run: |
          set -euo pipefail
          base64 -d android/chinese-v0524/native.tgz.b64 > /tmp/chinese.tgz
          echo '8c51e8bfefee0a8e1d8cf215b819b92ccbf6cb48c22f5b61d0b1edf1fb057552  /tmp/chinese.tgz' | sha256sum -c -
          mkdir /tmp/chinese
          tar -xzf /tmp/chinese.tgz -C /tmp/chinese
          PKG=build-src/app/src/main/java/com/seungho/barointerpreter
          cp /tmp/chinese/MainActivity.java /tmp/chinese/ChineseTtsClient.java /tmp/chinese/ChineseTtsEngine.java /tmp/chinese/ChineseTtsService.java /tmp/chinese/ChineseVoicePack.java /tmp/chinese/ChineseVoiceFiles.java /tmp/chinese/NeuralTtsClient.java /tmp/chinese/NeuralTtsEngine.java "$PKG/"
          cp /tmp/chinese/AndroidManifest.xml build-src/app/src/main/
          cp /tmp/chinese/build.gradle build-src/app/
          mkdir -p build-src/app/libs
          curl --fail --location --silent --show-error 'https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-static-link-onnxruntime-1.13.8.aar' -o /tmp/sherpa-upstream.aar
          echo 'b22c3fc1b6a45666d28892bb2f7694beeb77a8362d7ebd77c1a5431ec9435471  /tmp/sherpa-upstream.aar' | sha256sum -c -
          python3 /tmp/chinese/prepare-runtime.py /tmp/sherpa-upstream.aar build-src/app/libs/sherpa-onnx-static-1.13.8.aar
      - name: Configure update-compatible app variant
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          variant=os.environ['RELEASE_VARIANT']
          p=Path('build-src/app/build.gradle')
          s=p.read_text()
          assert "versionCode 27" in s and "versionName '0.5.24-share'" in s
          if variant=='Personal':
              s=s.replace("applicationId 'com.seungho.barointerpreter.shared'", "applicationId 'com.seungho.barointerpreter'")
              s=s.replace("versionName '0.5.24-share'", "versionName '0.5.24'")
              m=Path('build-src/app/src/main/java/com/seungho/barointerpreter/MainActivity.java')
              m.write_text(m.read_text().replace('여행메이트 공유용 0.5.24', '여행메이트 0.5.24'))
              Path('build-src/app/src/main/res/values/strings.xml').write_text('<resources><string name="app_name">여행메이트</string></resources>')
          p.write_text(s)
          PYTHON
      - name: Translation regression tests
        run: |
          set -euo pipefail
          base64 -d .ci/travelmate-v0513-a/hotfix-v0515.tgz.b64 > /tmp/hotfix.tgz
          echo '3051c10f13ff784aab0222713472728a50bae395d43d9fa1213073e36b8f3a90  /tmp/hotfix.tgz' | sha256sum -c -
          mkdir /tmp/hotfix /tmp/translation
          tar -xzf /tmp/hotfix.tgz -C /tmp/hotfix
          PKG=/tmp/translation/com/seungho/barointerpreter
          mkdir -p "$PKG"
          cp build-src/app/src/main/java/com/seungho/barointerpreter/{TravelTranslationQuality,TranslationVerification,TravelOrderTranslator}.java "$PKG/"
          cp /tmp/hotfix/TravelMateRegressionTest.java "$PKG/"
          javac -encoding UTF-8 "$PKG/"*.java
          java -cp /tmp/translation com.seungho.barointerpreter.TravelMateRegressionTest | tee translation-tests.txt
          grep -q 'TOTAL PASS=54' translation-tests.txt
      - name: Existing language and new integrity tests
        run: |
          set -euo pipefail
          PKG=/tmp/test/com/seungho/barointerpreter
          mkdir -p "$PKG/supertonic"
          cp /tmp/chinese/ChineseVoicePack.java /tmp/chinese/ChineseVoiceFiles.java /tmp/chinese/ChineseVoiceRegressionTest.java /tmp/chinese/SpeechLanguageTags.java /tmp/chinese/LanguageVoiceRegressionTest.java "$PKG/"
          cp /tmp/chinese/UnicodeProcessor.java "$PKG/supertonic/"
          javac -encoding UTF-8 "$PKG/"*.java "$PKG/supertonic/"*.java
          java -cp /tmp/test com.seungho.barointerpreter.ChineseVoiceRegressionTest | tee chinese-tests.txt
          java -cp /tmp/test com.seungho.barointerpreter.LanguageVoiceRegressionTest | tee language-tests.txt
          grep -q 'CHINESE VOICE PASS=67' chinese-tests.txt
          grep -q 'VOICE AND LANGUAGE PASS=22' language-tests.txt
      - name: Android compile and native library merge
        working-directory: build-src
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          gradle --no-daemon :app:compileReleaseJavaWithJavac :app:processReleaseMainManifest :app:mergeReleaseNativeLibs
          test -s app/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib/arm64-v8a/libsherpa-onnx-jni.so
          test -s app/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib/arm64-v8a/libonnxruntime.so
      - name: Build signed release APK
        working-directory: build-src
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signature, install metadata and ARM64 libraries
        run: |
          set -euo pipefail
          APK=build-src/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -tq "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -qi '7d411eb878d63e9b30e5a75c65ce1206d195b45a3e5f794955bd78f625b87b85' apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > apk-badging.txt
          PKG=com.seungho.barointerpreter.shared
          VERSION=0.5.24-share
          if [ "$RELEASE_VARIANT" = Personal ]; then PKG=com.seungho.barointerpreter; VERSION=0.5.24; fi
          grep -q "name='$PKG'" apk-badging.txt
          grep -q "versionCode='27'" apk-badging.txt
          grep -q "versionName='$VERSION'" apk-badging.txt
          python3 - <<'PYTHON'
          import zipfile
          with zipfile.ZipFile('build-src/app/build/outputs/apk/release/app-release.apk') as z:
              files=z.namelist()
              assert 'lib/arm64-v8a/libsherpa-onnx-jni.so' in files
              assert 'lib/arm64-v8a/libonnxruntime.so' in files
              assert len([x for x in files if x.endswith('libonnxruntime.so')])==1
              assert not any(x.startswith(('lib/x86/','lib/x86_64/','lib/armeabi-v7a/')) for x in files)
              manifest=z.read('AndroidManifest.xml')
              assert 'ChineseTtsService'.encode('utf-16-le') in manifest
          PYTHON
          cp "$APK" "TravelMate-v0.5.24-$RELEASE_VARIANT-arm64.apk"
          sha256sum "TravelMate-v0.5.24-$RELEASE_VARIANT-arm64.apk" > "TravelMate-v0.5.24-$RELEASE_VARIANT-arm64.sha256"
          (cd build-src && zip -qr "../TravelMate_Android_v0.5.24-${RELEASE_VARIANT}_source.zip" . -x 'app/build/*' '.gradle/*' 'build/*' 'local.properties')
      - uses: actions/upload-artifact@v4
        with:
          name: TravelMate-v0.5.24-${{ matrix.variant }}-arm64
          path: |
            TravelMate-v0.5.24-*.apk
            TravelMate-v0.5.24-*.sha256
            TravelMate_Android_v0.5.24-*_source.zip
            apk-signature.txt
            apk-badging.txt
            chinese-tests.txt
            language-tests.txt
            translation-tests.txt
          if-no-files-found: error
          retention-days: 30
