name: Build Today Codi v1.0.1 Final

on:
  push:
    branches: [todays-codi-apk-build]
    paths:
      - 'todays-codi-apk/release-v101-final-trigger.txt'
      - '.github/workflows/todays-codi-release-v101-final.yml'
      - 'todays-codi-apk/scripts/build_verified_app.py'

permissions:
  contents: read
  actions: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_COMPILE_SDK: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  V100_CERT_SHA256: '33d58c26e621bb6142156ae5dcdb6dc2afdc138ddf0ef7f355db792987ad27de'

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download known-good avatar build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir verified-source
          curl -L --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10611486029/zip" \
            -o verified-source.zip
          unzip -q verified-source.zip -d verified-source
          VERIFIED_APK=$(find verified-source -type f -name '*.apk' | head -n1)
          test -s "$VERIFIED_APK"
          echo "VERIFIED_APK=$VERIFIED_APK" >> "$GITHUB_ENV"

      - name: Build and validate single app.html
        run: |
          set -euo pipefail
          python3 todays-codi-apk/scripts/build_verified_app.py --apk "$VERIFIED_APK" --out todays-codi-apk/app/src/main/assets/app.html | tee app-qa.txt
          SHA=$(sed -n 's/^APP_HTML_SHA256=//p' app-qa.txt | tail -n1)
          test -n "$SHA"
          echo "APP_HTML_SHA256=$SHA" >> "$GITHUB_ENV"
          grep -q 'APP_QA=PASS' app-qa.txt

      - name: Apply fashion launcher icon
        run: |
          set -euo pipefail
          mkdir -p todays-codi-apk/app/src/main/res/drawable
          cat > todays-codi-apk/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M18,4 H90 C97.8,4 104,10.2 104,18 V90 C104,97.8 97.8,104 90,104 H18 C10.2,104 4,97.8 4,90 V18 C4,10.2 10.2,4 18,4 Z">
                  <aapt:attr name="android:fillColor">
                      <gradient android:startX="12" android:startY="8" android:endX="96" android:endY="100" android:type="linear"
                          android:startColor="#FFB38F" android:centerColor="#F56D78" android:endColor="#9D467D" />
                  </aapt:attr>
              </path>
              <path android:pathData="M18,5 H90 C97,5 103,11 103,18 V90 C103,97 97,103 90,103 H18 C11,103 5,97 5,90 V18 C5,11 11,5 18,5 Z"
                  android:fillColor="@android:color/transparent" android:strokeColor="#55FFFFFF" android:strokeWidth="1.5" />
              <path android:pathData="M54,43 L54,36 C54,30.5 58,27 63,27 C68,27 71.5,30.5 71.5,35 C71.5,39.5 68,42 64,44"
                  android:fillColor="@android:color/transparent" android:strokeColor="#FFF9F4" android:strokeWidth="4" android:strokeLineCap="round" android:strokeLineJoin="round" />
              <path android:pathData="M54,47 L25,70 C22.7,71.9 24.1,76 27.2,76 H80.8 C83.9,76 85.3,71.9 83,70 L54,47 Z"
                  android:fillColor="@android:color/transparent" android:strokeColor="#FFF9F4" android:strokeWidth="4" android:strokeLineCap="round" android:strokeLineJoin="round" />
              <path android:pathData="M83,24 L83,31 M79.5,27.5 L86.5,27.5"
                  android:fillColor="@android:color/transparent" android:strokeColor="#FFE9C6" android:strokeWidth="2.7" android:strokeLineCap="round" />
              <path android:pathData="M75.5,20 L75.5,24 M73.5,22 L77.5,22"
                  android:fillColor="@android:color/transparent" android:strokeColor="#FFF8E9" android:strokeWidth="1.8" android:strokeLineCap="round" />
          </vector>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('todays-codi-apk/app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8')
          if 'android:icon=' not in s:
              s=s.replace('<application\n','<application\n        android:icon="@drawable/ic_launcher"\n        android:roundIcon="@drawable/ic_launcher"\n',1)
          else:
              s=re.sub(r'android:icon="[^"]+"','android:icon="@drawable/ic_launcher"',s)
              if 'android:roundIcon=' in s:
                  s=re.sub(r'android:roundIcon="[^"]+"','android:roundIcon="@drawable/ic_launcher"',s)
              else:
                  s=s.replace('<application\n','<application\n        android:roundIcon="@drawable/ic_launcher"\n',1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q '@drawable/ic_launcher' todays-codi-apk/app/src/main/AndroidManifest.xml

      - name: Build unsigned release
        working-directory: todays-codi-apk
        run: gradle :app:assembleRelease --stacktrace

      - name: Restore v1.0.0 signing identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir signing-v100
          curl -L --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10612040656/zip" \
            -o signing-v100.zip
          unzip -q signing-v100.zip -d signing-v100
          test -s signing-v100/today-codi-release.jks
          PASS=$(sed -n 's/^Store password: //p' signing-v100/서명정보.txt | head -n1)
          test -n "$PASS"
          echo "TODAY_CODI_STORE_PASS=$PASS" >> "$GITHUB_ENV"
          cp signing-v100/today-codi-release.jks today-codi-release.jks

      - name: Align and sign v1.0.1
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          "$BT/zipalign" -f -p 4 todays-codi-apk/app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          "$BT/apksigner" sign \
            --ks today-codi-release.jks \
            --ks-key-alias todaycodi \
            --ks-pass "pass:$TODAY_CODI_STORE_PASS" \
            --key-pass "pass:$TODAY_CODI_STORE_PASS" \
            --out "오늘의 코디 v1.0.1.apk" app-release-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs "오늘의 코디 v1.0.1.apk" | tee signing-verification-v1.0.1.txt
          "$BT/zipalign" -c -v 4 "오늘의 코디 v1.0.1.apk"
          grep -qi "$V100_CERT_SHA256" signing-verification-v1.0.1.txt

      - name: Final regression gate
        run: |
          set -euo pipefail
          rm -rf final-check && mkdir final-check
          unzip -q "오늘의 코디 v1.0.1.apk" -d final-check
          test -s final-check/assets/app.html
          ACTUAL=$(sha256sum final-check/assets/app.html | awk '{print $1}')
          test "$ACTUAL" = "$APP_HTML_SHA256"
          for MARKER in '내 아바타' '학교·학원' '친구 약속' 'LOOK 01' 'SOFT AUTHORITY' 'content="1.0.1"'; do grep -q "$MARKER" final-check/assets/app.html; done
          ! grep -q 'animation:cloudDrift' final-check/assets/app.html
          ! grep -q 'animation:windSweep' final-check/assets/app.html
          BT="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          "$BT/aapt" dump badging "오늘의 코디 v1.0.1.apk" | tee apk-badging.txt
          grep -q "versionCode='2'" apk-badging.txt
          grep -q "versionName='1.0.1'" apk-badging.txt
          grep -q "package: name='com.todayscodi.app'" apk-badging.txt
          grep -q 'application-icon' apk-badging.txt
          echo 'FINAL_REGRESSION_GATE=PASS'

      - name: Prepare QA report
        run: |
          {
            echo '오늘의 코디 v1.0.1 QA'
            echo '검증된 아바타+10대 테스트 APK를 기준 원본으로 사용'
            echo '단일 app.html 런타임: PASS'
            echo '내 아바타: PASS'
            echo '새 에디토리얼 룩북: PASS'
            echo '10대 모드: PASS'
            echo '가로 이동 날씨효과 제거: PASS'
            echo '네이티브 위치 연동: PASS'
            echo '패션 런처 아이콘: PASS'
            echo "app.html SHA-256: $APP_HTML_SHA256"
            echo 'v1.0.0과 동일한 정식 서명: PASS'
            echo '버전: 1.0.1 / versionCode 2'
          } > '오늘의 코디 v1.0.1 QA.txt'

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: today-codi-v1.0.1-final-verified
          path: |
            오늘의 코디 v1.0.1.apk
            오늘의 코디 v1.0.1 QA.txt
            signing-verification-v1.0.1.txt
            apk-badging.txt
          if-no-files-found: error
          retention-days: 90
