name: PS Radar Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ps-radar-pages.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ps-radar-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          path: root

      - name: Checkout complete PS Radar runtime
        uses: actions/checkout@v6
        with:
          ref: ps-radar-v12-render
          path: payload

      - name: Restore PS Radar into main/ps-radar
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/psradar-runtime root/ps-radar
          mkdir -p /tmp/psradar-runtime root/ps-radar

          cat payload/ps-radar-v12-runtime.part* | tr -d '\r\n\t ' > /tmp/psradar-runtime.b64
          base64 -d /tmp/psradar-runtime.b64 > /tmp/psradar-runtime.tgz
          tar -xzf /tmp/psradar-runtime.tgz -C /tmp/psradar-runtime

          cp /tmp/psradar-runtime/index.html root/ps-radar/index.html
          cp /tmp/psradar-runtime/app.js root/ps-radar/app.js
          cp /tmp/psradar-runtime/styles.css root/ps-radar/styles.css
          cp /tmp/psradar-runtime/manifest.json root/ps-radar/manifest.json
          cp /tmp/psradar-runtime/sw.js root/ps-radar/sw.js
          mkdir -p root/ps-radar/icons root/ps-radar/data
          cp -a /tmp/psradar-runtime/icons/. root/ps-radar/icons/
          cp -a /tmp/psradar-runtime/data/. root/ps-radar/data/
          cp root/ps-radar/index.html root/ps-radar/404.html

          test -s root/ps-radar/index.html
          test -s root/ps-radar/app.js
          test -s root/ps-radar/styles.css
          test -s root/ps-radar/manifest.json
          grep -qi 'PS Radar' root/ps-radar/index.html

      - name: Commit PS Radar files to main
        shell: bash
        run: |
          set -euo pipefail
          cd root
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ps-radar
          if git diff --cached --quiet; then
            echo 'PS Radar files already current'
          else
            git commit -m 'Publish PS Radar static site [skip ci]'
            git push origin HEAD:main
          fi

      - name: Build Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp -a root/. site/
          rm -rf site/.git site/.github
          touch site/.nojekyll site/ps-radar/.nojekyll
          test -s site/index.html
          test -s site/ps-radar/index.html
          test -s site/ps-radar/app.js
          grep -q '유통기한 조사' site/index.html
          grep -qi 'PS Radar' site/ps-radar/index.html
          echo "PS Radar files: $(find site/ps-radar -type f | wc -l)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
