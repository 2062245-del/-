name: PS Radar Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ps-radar-pages.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ps-radar-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout existing Pages root
        uses: actions/checkout@v6
        with:
          ref: main
          path: root

      - name: Checkout complete PS Radar runtime
        uses: actions/checkout@v6
        with:
          ref: ps-radar-v12-render
          path: payload

      - name: Build combined Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site /tmp/psradar-runtime
          mkdir -p site/ps-radar /tmp/psradar-runtime

          # Keep the existing Pages root intact.
          cp -a root/. site/
          rm -rf site/.git site/.github

          # Restore the complete PS Radar project already stored on GitHub.
          cat payload/ps-radar-v12-runtime.part* | tr -d '\r\n\t ' > /tmp/psradar-runtime.b64
          base64 -d /tmp/psradar-runtime.b64 > /tmp/psradar-runtime.tgz
          tar -xzf /tmp/psradar-runtime.tgz -C /tmp/psradar-runtime

          # Copy only the static files needed by GitHub Pages.
          cp /tmp/psradar-runtime/index.html site/ps-radar/index.html
          cp /tmp/psradar-runtime/app.js site/ps-radar/app.js
          cp /tmp/psradar-runtime/styles.css site/ps-radar/styles.css
          cp /tmp/psradar-runtime/manifest.json site/ps-radar/manifest.json
          cp /tmp/psradar-runtime/sw.js site/ps-radar/sw.js
          mkdir -p site/ps-radar/icons site/ps-radar/data
          cp -a /tmp/psradar-runtime/icons/. site/ps-radar/icons/
          cp -a /tmp/psradar-runtime/data/. site/ps-radar/data/

          # A direct fallback for mobile browsers and stale links.
          cp site/ps-radar/index.html site/ps-radar/404.html

          test -s site/index.html
          test -s site/ps-radar/index.html
          test -s site/ps-radar/app.js
          test -s site/ps-radar/styles.css
          test -s site/ps-radar/manifest.json
          grep -q '유통기한 조사' site/index.html
          grep -qi 'PS Radar' site/ps-radar/index.html
          touch site/.nojekyll site/ps-radar/.nojekyll

          echo "Root preserved: $(wc -c < site/index.html) bytes"
          echo "PS Radar static files: $(find site/ps-radar -type f | wc -l)"
          find site/ps-radar -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
