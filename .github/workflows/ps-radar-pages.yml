name: PS Radar Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ps-radar/**'
      - '.github/workflows/ps-radar-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ps-radar-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          path: root

      - name: Validate PS Radar static site
        shell: bash
        run: |
          set -euo pipefail
          test -s root/ps-radar/index.html
          test -s root/ps-radar/app.js
          test -s root/ps-radar/styles.css
          test -s root/ps-radar/ui-v13.css
          test -s root/ps-radar/ui-v13.js
          test -s root/ps-radar/data/games.json
          test -s root/ps-radar/data/discovery.json
          test -s root/ps-radar/data/store.json
          test -s root/ps-radar/data/upcoming.json
          grep -qi 'PS Radar' root/ps-radar/index.html
          grep -q 'PlayStation 혜택을 한눈에' root/ps-radar/index.html
          grep -q 'data-page="upcoming"' root/ps-radar/index.html
          node --check root/ps-radar/app.js
          node --check root/ps-radar/ui-v13.js
          node -e "JSON.parse(require('fs').readFileSync('root/ps-radar/data/games.json','utf8')); JSON.parse(require('fs').readFileSync('root/ps-radar/data/store.json','utf8')); JSON.parse(require('fs').readFileSync('root/ps-radar/data/discovery.json','utf8')); JSON.parse(require('fs').readFileSync('root/ps-radar/data/upcoming.json','utf8'));"
          echo "PS Radar files: $(find root/ps-radar -type f | wc -l)"

      - name: Build Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp -a root/. site/
          rm -rf site/.git site/.github
          touch site/.nojekyll site/ps-radar/.nojekyll
          test -s site/index.html
          test -s site/ps-radar/index.html
          grep -q '유통기한 조사' site/index.html
          grep -qi 'PS Radar' site/ps-radar/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
