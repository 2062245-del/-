name: PS Radar Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ps-radar-pages.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ps-radar-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout PS Radar branch
        uses: actions/checkout@v6
        with:
          ref: ps-radar-v13-pages

      - name: Rebuild static site package
        shell: bash
        run: |
          set -euo pipefail
          cat ps-radar-v13-runtime.part* | tr -d '\r\n\t ' > /tmp/ps-radar-v13.b64
          rem=$(( $(wc -c < /tmp/ps-radar-v13.b64) % 4 ))
          if [ "$rem" -eq 2 ]; then printf '==' >> /tmp/ps-radar-v13.b64; fi
          if [ "$rem" -eq 3 ]; then printf '=' >> /tmp/ps-radar-v13.b64; fi
          if [ "$rem" -eq 1 ]; then echo 'Invalid base64 length'; exit 1; fi
          base64 -d /tmp/ps-radar-v13.b64 > /tmp/ps-radar-v13.tgz
          mkdir -p site
          set +e
          tar -xzf /tmp/ps-radar-v13.tgz -C site
          tar_status=$?
          set -e
          echo "tar status: $tar_status"
          find site -maxdepth 2 -type f -printf '%p %s bytes\n' | sort | head -80
          test -f site/index.html
          test -s site/index.html
          touch site/.nojekyll
          echo "Recovered $(find site -type f | wc -l) site files"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
