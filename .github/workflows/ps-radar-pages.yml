name: PS Radar Online Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ps-radar-preview/**'
      - 'ps-radar/data/**'
      - '.github/workflows/ps-radar-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ps-radar-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          path: root

      - name: Validate PS Radar preview
        shell: bash
        run: |
          set -euo pipefail
          test -s root/ps-radar-preview/index.html
          grep -q 'PS Radar 2.2.5 Preview' root/ps-radar-preview/index.html
          grep -q 'id="refreshBtn"' root/ps-radar-preview/index.html
          grep -q 'raw.githubusercontent.com/2062245-del/-/main/ps-radar/data/' root/ps-radar-preview/index.html
          test -s root/ps-radar/data/deals-auto.json
          test -s root/ps-radar/data/deal-history.json
          test -s root/ps-radar/data/deal-trends.json
          echo 'PS Radar online preview validation passed'

      - name: Build Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp -a root/. site/
          rm -rf site/.git site/.github
          touch site/.nojekyll site/ps-radar-preview/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
