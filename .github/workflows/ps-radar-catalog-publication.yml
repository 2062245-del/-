name: PS Radar Catalog Publication
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ps-radar-catalog-publication.yml'
permissions:
  contents: write
concurrency:
  group: ps-radar-catalog-relationships
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified game product policy
        run: node ps-radar/scripts/sanitize-catalog-v232.mjs
      - name: Build compact mobile data
        run: node ps-radar/scripts/build-app-catalog-v232.mjs
      - name: Commit approved data
        run: |
          git add ps-radar/data/store-catalog-v232.json ps-radar/data/catalog-app-v232.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish PS Radar verified game and expansion catalog'
          git pull --rebase origin main
          git push origin main
