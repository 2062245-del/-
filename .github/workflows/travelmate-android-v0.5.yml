name: Build TravelMate v0.5 Android APK

on:
  push:
    branches: [main]
    paths:
      - '.ci/travelmate-v05-chunk-*.b64'
      - '.github/workflows/travelmate-android-v0.5.yml'
  workflow_dispatch:

concurrency:
  group: travelmate-v05
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: .ci-signing/baro-interpreter.jks
          key: baro-interpreter-release-keystore-v1

      - name: Restore source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build-src .ci-signing
          cat .ci/travelmate-v05-chunk-*.b64 | base64 --decode > /tmp/travelmate-v05.zip
          echo 'bb52915a9f47366d0d59fe26cb9549ac7c6d4bd03c45bd06ce81f7b44790318a  /tmp/travelmate-v05.zip' | sha256sum -c -
          unzip -q /tmp/travelmate-v05.zip -d build-src

      - name: Fix sherpa Android dependency graph
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build-src/app/build.gradle')
          s = p.read_text()
          old = "    implementation 'com.github.k2-fsa:sherpa-onnx:v1.13.8'"
          new = "    implementation('com.github.k2-fsa:sherpa-onnx:v1.13.8') {\n        exclude group: 'com.github.k2-fsa.sherpa-onnx', module: 'sherpa-onnx-jvm'\n    }"
          if old not in s and "module: 'sherpa-onnx-jvm'" not in s:
              raise SystemExit('sherpa dependency line not found')
          if old in s:
              s = s.replace(old, new)
          p.write_text(s)
          PY
          grep -q "module: 'sherpa-onnx-jvm'" build-src/app/build.gradle

      - name: Download bundled Neural TTS model
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --retry 3 -o /tmp/supertonic3.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-supertonic-3-tts-int8-2026-05-11.tar.bz2
          mkdir -p /tmp/supertonic
          tar xf /tmp/supertonic3.tar.bz2 -C /tmp/supertonic
          MODEL=/tmp/supertonic/sherpa-onnx-supertonic-3-tts-int8-2026-05-11
          ASSETS=build-src/app/src/main/assets/supertonic3
          mkdir -p "$ASSETS"
          for f in duration_predictor.int8.onnx text_encoder.int8.onnx vector_estimator.int8.onnx vocoder.int8.onnx tts.json unicode_indexer.bin voice.bin; do
            test -s "$MODEL/$f"
            cp "$MODEL/$f" "$ASSETS/$f"
          done
          du -sh "$ASSETS"

      - name: Prepare signing
        shell: bash
        run: |
          set -euxo pipefail
          KEY="$PWD/.ci-signing/baro-interpreter.jks"
          if [ ! -s "$KEY" ]; then
            echo 'Expected persistent signing key was not restored.' >&2
            exit 1
          fi
          echo "BARO_KEYSTORE_PATH=$KEY" >> "$GITHUB_ENV"
          echo "BARO_KEYSTORE_PASSWORD=baro-local-release" >> "$GITHUB_ENV"
          echo "BARO_KEY_ALIAS=baro" >> "$GITHUB_ENV"
          echo "BARO_KEY_PASSWORD=baro-local-release" >> "$GITHUB_ENV"

      - name: Static quality checks
        shell: bash
        run: |
          set -euxo pipefail
          SRC=build-src/app/src/main/java/com/seungho/barointerpreter/MainActivity.java
          test -s "$SRC"
          grep -q "versionName '0.5.0'" build-src/app/build.gradle
          grep -q "versionCode 6" build-src/app/build.gradle
          grep -q "module: 'sherpa-onnx-jvm'" build-src/app/build.gradle
          grep -q '여행메이트' build-src/app/src/main/res/values/strings.xml
          grep -q 'showWallet' "$SRC"
          grep -q 'showCurrencyConverter' "$SRC"
          grep -q 'showPhrasebook' "$SRC"
          grep -q 'female_voice' "$SRC"
          grep -q 'class NeuralTtsEngine' build-src/app/src/main/java/com/seungho/barointerpreter/NeuralTtsEngine.java
          grep -q 'class WalletStore' build-src/app/src/main/java/com/seungho/barointerpreter/WalletStore.java
          grep -q 'class LanguageCatalog' build-src/app/src/main/java/com/seungho/barointerpreter/LanguageCatalog.java
          grep -q 'class TravelCatalog' build-src/app/src/main/java/com/seungho/barointerpreter/TravelCatalog.java
          test -s build-src/app/src/main/assets/supertonic3/voice.bin

      - name: Build release APK
        working-directory: build-src
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=build-src/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -q "Signer #1 certificate SHA-256 digest: 7d411eb878d63e9b30e5a75c65ce1206d195b45a3e5f794955bd78f625b87b85" apk-signature.txt
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.seungho.barointerpreter' versionCode='6' versionName='0.5.0'" apk-badging.txt
          grep -q "application-label:'여행메이트'" apk-badging.txt
          unzip -l "$APK" | grep -q 'assets/supertonic3/voice.bin'
          unzip -t "$APK" | tee apk-ziptest.txt
          cp "$APK" TravelMate-v0.5.0.apk
          sha256sum TravelMate-v0.5.0.apk | tee TravelMate-v0.5.0.sha256
          ls -lh TravelMate-v0.5.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TravelMate-v0.5.0
          path: |
            TravelMate-v0.5.0.apk
            TravelMate-v0.5.0.sha256
            apk-signature.txt
            apk-badging.txt
            apk-ziptest.txt
          if-no-files-found: error
          retention-days: 30
