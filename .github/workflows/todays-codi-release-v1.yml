name: Build Today Codi Release v1

on:
  push:
    branches:
      - todays-codi-apk-build
    paths:
      - 'todays-codi-apk/release-v1-trigger.txt'
      - '.github/workflows/todays-codi-release-v1.yml'

permissions:
  contents: read
  actions: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_COMPILE_SDK: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  APP_HTML_SHA256: '7a696e0d2631e8c514c244e45f66e9ef5ef1155cd43b27254f8fe160538f33da'
  V100_CERT_SHA256: '33d58c26e621bb6142156ae5dcdb6dc2afdc138ddf0ef7f355db792987ad27de'

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore and validate single app source
        shell: bash
        run: |
          set -euo pipefail
          cd todays-codi-apk
          base64 -d app-v1.0.1.html.gz.b64 | gzip -d > app/src/main/assets/app.html
          echo "$APP_HTML_SHA256  app/src/main/assets/app.html" | sha256sum -c -

          grep -q 'content="1.0.1"' app/src/main/assets/app.html
          grep -q '내 아바타' app/src/main/assets/app.html
          grep -q '학교·학원' app/src/main/assets/app.html
          grep -q '친구 약속' app/src/main/assets/app.html
          grep -q 'LOOK 01' app/src/main/assets/app.html
          grep -q 'SOFT AUTHORITY' app/src/main/assets/app.html
          grep -q 'window.NativeGeo.getCurrentPosition' app/src/main/assets/app.html

          ! grep -q 'animation:cloudDrift' app/src/main/assets/app.html
          ! grep -q 'animation:windSweep' app/src/main/assets/app.html
          ! grep -q 'translateX(150vw)' app/src/main/assets/app.html
          ! grep -q 'translateX(28vw)' app/src/main/assets/app.html

          python3 - <<'PY'
          import re, pathlib, subprocess
          html=pathlib.Path('app/src/main/assets/app.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          assert len(scripts)>=4
          for i,script in enumerate(scripts):
              p=pathlib.Path(f'/tmp/today-codi-script-{i}.js')
              p.write_text(script,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          print('SINGLE SOURCE QA: PASS')
          PY

      - name: Build unsigned release APK
        working-directory: todays-codi-apk
        run: gradle :app:assembleRelease --stacktrace

      - name: Restore v1.0.0 signing identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing-v100
          curl -L --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10612040656/zip" \
            -o signing-v100.zip
          unzip -q signing-v100.zip -d signing-v100
          test -s signing-v100/today-codi-release.jks
          PASS=$(sed -n 's/^Store password: //p' signing-v100/서명정보.txt | head -n1)
          test -n "$PASS"
          echo "TODAY_CODI_STORE_PASS=$PASS" >> "$GITHUB_ENV"
          cp signing-v100/today-codi-release.jks ./today-codi-release.jks

      - name: Align and sign v1.0.1
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          "$BT/zipalign" -f -p 4 todays-codi-apk/app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          "$BT/apksigner" sign \
            --ks today-codi-release.jks \
            --ks-key-alias todaycodi \
            --ks-pass "pass:$TODAY_CODI_STORE_PASS" \
            --key-pass "pass:$TODAY_CODI_STORE_PASS" \
            --out "오늘의 코디 v1.0.1.apk" \
            app-release-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs "오늘의 코디 v1.0.1.apk" | tee signing-verification-v1.0.1.txt
          "$BT/zipalign" -c -v 4 "오늘의 코디 v1.0.1.apk"
          grep -qi "$V100_CERT_SHA256" signing-verification-v1.0.1.txt

      - name: Final APK regression gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final-apk-check && mkdir final-apk-check
          unzip -q "오늘의 코디 v1.0.1.apk" -d final-apk-check
          test -s final-apk-check/assets/app.html
          echo "$APP_HTML_SHA256  final-apk-check/assets/app.html" | sha256sum -c -
          grep -q '내 아바타' final-apk-check/assets/app.html
          grep -q '학교·학원' final-apk-check/assets/app.html
          grep -q 'LOOK 01' final-apk-check/assets/app.html
          grep -q 'SOFT AUTHORITY' final-apk-check/assets/app.html
          ! grep -q 'animation:cloudDrift' final-apk-check/assets/app.html
          ! grep -q 'animation:windSweep' final-apk-check/assets/app.html

          BT="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          "$BT/aapt" dump badging "오늘의 코디 v1.0.1.apk" | tee apk-badging.txt
          grep -q "versionCode='2'" apk-badging.txt
          grep -q "versionName='1.0.1'" apk-badging.txt
          grep -q "package: name='com.todayscodi.app'" apk-badging.txt
          echo 'FINAL APK REGRESSION GATE: PASS'

      - name: Prepare QA report
        shell: bash
        run: |
          {
            echo '오늘의 코디 v1.0.1 QA'
            echo 'Single app.html architecture: PASS'
            echo 'Avatar UI marker: PASS'
            echo 'Editorial LOOK marker: PASS'
            echo 'Teen mode marker: PASS'
            echo 'Horizontal cloud/wind animation removed: PASS'
            echo 'Native location bridge marker: PASS'
            echo 'app.html SHA-256: 7a696e0d2631e8c514c244e45f66e9ef5ef1155cd43b27254f8fe160538f33da'
            echo 'v1.0.0 signing certificate reused: PASS'
            echo 'Version: 1.0.1 (versionCode 2)'
          } > '오늘의 코디 v1.0.1 QA.txt'

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: today-codi-v1.0.1-release
          path: |
            오늘의 코디 v1.0.1.apk
            오늘의 코디 v1.0.1 QA.txt
            signing-verification-v1.0.1.txt
          if-no-files-found: error
          retention-days: 90
