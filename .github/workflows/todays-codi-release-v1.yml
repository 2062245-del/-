name: Build Today Codi Release v1

on:
  push:
    branches:
      - todays-codi-apk-build
    paths:
      - 'todays-codi-apk/release-v1-trigger.txt'
      - '.github/workflows/todays-codi-release-v1.yml'

permissions:
  contents: read
  actions: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_COMPILE_SDK: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  V100_CERT_SHA256: '33d58c26e621bb6142156ae5dcdb6dc2afdc138ddf0ef7f355db792987ad27de'

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild one verified app.html from known-good APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf verified-source && mkdir verified-source
          curl -L --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10611486029/zip" \
            -o verified-source.zip
          unzip -q verified-source.zip -d verified-source
          VERIFIED_APK=$(find verified-source -type f -name '*.apk' | head -n1)
          test -s "$VERIFIED_APK"
          export VERIFIED_APK

          python3 - <<'PY'
          import base64,gzip,os,re,zipfile,hashlib,pathlib,subprocess
          apk=os.environ['VERIFIED_APK']
          with zipfile.ZipFile(apk) as z:
              def txt(name): return z.read('assets/'+name).decode('utf-8').strip()
              base64_src=''.join(txt(f'part{i}.txt') for i in (5,6,7,8,9,10,3))
              editorial64=''.join(txt(f'upgrade{i}.txt') for i in (1,2,3))
              avatar64=''.join(txt(f'upgrade{i}.txt') for i in (4,5,6))
          html=gzip.decompress(base64.b64decode(base64_src)).decode('utf-8')
          editorial=gzip.decompress(base64.b64decode(editorial64)).decode('utf-8')
          avatar=gzip.decompress(base64.b64decode(avatar64)).decode('utf-8')

          native='''<script id="native-apk-bridge">\n(function(){\n  if(!window.AndroidApp) return;\n  window.NativeGeo={getCurrentPosition:function(success,error,options){\n    window.__nativeGeoSuccess=function(lat,lng,acc,name){success({coords:{latitude:Number(lat),longitude:Number(lng),accuracy:Number(acc||0)},locationName:String(name||'')});};\n    window.__nativeGeoError=function(msg){if(error)error({code:1,message:String(msg||'위치를 확인하지 못했습니다.')});};\n    AndroidApp.requestLocation();\n  }};\n  document.documentElement.classList.add('native-apk');\n  document.addEventListener('DOMContentLoaded',function(){var b=document.getElementById('installAppBtn');if(b)b.style.display='none';document.body&&document.body.setAttribute('data-native-app','android');});\n})();\n</script>'''

          html=html.replace('navigator.geolocation.getCurrentPosition','window.NativeGeo.getCurrentPosition')
          html=html.replace('</head>',native+'\n</head>',1) if '</head>' in html else native+html
          upgrades='<script id="today-codi-verified-upgrades">'+editorial+'\n'+avatar+'</script>'
          html=html.replace('</body>',upgrades+'\n</body>',1) if '</body>' in html else html+upgrades

          # v1.0.1: no continuous horizontal/sweeping ambience.
          html=html.replace('@keyframes panelSheen{0%,72%,100%{transform:translateX(-115%)}84%{transform:translateX(115%)}}','@keyframes panelSheen{0%,100%{opacity:0}50%{opacity:.08}}')
          html=html.replace('#weatherFx .fx-drop{position:absolute;top:-15vh;width:1px;height:12vh;background:linear-gradient(transparent,rgba(189,218,255,.58));transform:rotate(8deg);animation:rainFall linear infinite;}','#weatherFx .fx-drop{position:absolute;top:-15vh;width:1px;height:12vh;background:linear-gradient(transparent,rgba(189,218,255,.58));animation:rainFall linear infinite;}')
          html=html.replace('@keyframes rainFall{to{transform:translate3d(-9vw,120vh,0) rotate(8deg)}}','@keyframes rainFall{to{transform:translate3d(0,120vh,0)}}')
          html=html.replace('@keyframes snowFall{0%{transform:translate3d(0,-8vh,0) rotate(0)}50%{transform:translate3d(4vw,52vh,0) rotate(180deg)}100%{transform:translate3d(-2vw,112vh,0) rotate(360deg)}}','@keyframes snowFall{0%{transform:translate3d(0,-8vh,0) rotate(0)}100%{transform:translate3d(0,112vh,0) rotate(360deg)}}')
          html=html.replace('#weatherFx .fx-cloud{position:absolute;width:42vw;height:16vw;max-height:120px;border-radius:50%;background:radial-gradient(ellipse,rgba(215,220,225,.10),rgba(215,220,225,0) 70%);filter:blur(9px);animation:cloudDrift 18s ease-in-out infinite alternate;}','#weatherFx .fx-cloud{position:absolute;width:42vw;height:16vw;max-height:120px;border-radius:50%;background:radial-gradient(ellipse,rgba(215,220,225,.10),rgba(215,220,225,0) 70%);filter:blur(9px);}')
          html=html.replace('@keyframes cloudDrift{from{transform:translateX(-8vw)}to{transform:translateX(28vw)}}','@keyframes cloudDrift{from{opacity:.8}to{opacity:.8}}')
          html=html.replace('#weatherFx .fx-wind{position:absolute;left:-30vw;width:28vw;height:1px;background:linear-gradient(90deg,transparent,rgba(235,238,231,.38),transparent);animation:windSweep linear infinite;}','#weatherFx .fx-wind{display:none!important;}')
          html=html.replace('@keyframes windSweep{to{transform:translateX(150vw)}}','@keyframes windSweep{to{opacity:0}}')
          html=html.replace("el.className='fx-wind'","el.className='fx-wind-disabled'")
          html=html.replace('<title>오늘의 코디</title>','<title>오늘의 코디</title><meta name="today-codi-version" content="1.0.1"><meta name="today-codi-features" content="avatar,editorial-lookbook,teen,native-location,no-horizontal-weather">',1)

          out=pathlib.Path('todays-codi-apk/app/src/main/assets/app.html')
          out.write_text(html,encoding='utf-8')
          digest=hashlib.sha256(out.read_bytes()).hexdigest()
          pathlib.Path('/tmp/app-html-sha.txt').write_text(digest)

          required=['내 아바타','학교·학원','친구 약속','LOOK 01','SOFT AUTHORITY','window.NativeGeo.getCurrentPosition','content="1.0.1"']
          for x in required: assert x in html, x
          forbidden=['animation:cloudDrift','animation:windSweep','translateX(150vw)','translateX(28vw)']
          for x in forbidden: assert x not in html, x
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          assert len(scripts)>=4
          for i,s in enumerate(scripts):
              p=pathlib.Path(f'/tmp/codi-{i}.js'); p.write_text(s,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          print('KNOWN-GOOD REBUILD QA PASS',digest,len(html.encode()))
          PY
          echo "APP_HTML_SHA256=$(cat /tmp/app-html-sha.txt)" >> "$GITHUB_ENV"

      - name: Build unsigned release APK
        working-directory: todays-codi-apk
        run: gradle :app:assembleRelease --stacktrace

      - name: Restore v1.0.0 signing identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf signing-v100 && mkdir signing-v100
          curl -L --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10612040656/zip" \
            -o signing-v100.zip
          unzip -q signing-v100.zip -d signing-v100
          test -s signing-v100/today-codi-release.jks
          PASS=$(sed -n 's/^Store password: //p' signing-v100/서명정보.txt | head -n1)
          test -n "$PASS"
          echo "TODAY_CODI_STORE_PASS=$PASS" >> "$GITHUB_ENV"
          cp signing-v100/today-codi-release.jks today-codi-release.jks

      - name: Align and sign v1.0.1
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          "$BT/zipalign" -f -p 4 todays-codi-apk/app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          "$BT/apksigner" sign --ks today-codi-release.jks --ks-key-alias todaycodi --ks-pass "pass:$TODAY_CODI_STORE_PASS" --key-pass "pass:$TODAY_CODI_STORE_PASS" --out "오늘의 코디 v1.0.1.apk" app-release-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs "오늘의 코디 v1.0.1.apk" | tee signing-verification-v1.0.1.txt
          "$BT/zipalign" -c -v 4 "오늘의 코디 v1.0.1.apk"
          grep -qi "$V100_CERT_SHA256" signing-verification-v1.0.1.txt

      - name: Final APK regression gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final-apk-check && mkdir final-apk-check
          unzip -q "오늘의 코디 v1.0.1.apk" -d final-apk-check
          test -s final-apk-check/assets/app.html
          ACTUAL=$(sha256sum final-apk-check/assets/app.html | awk '{print $1}')
          test "$ACTUAL" = "$APP_HTML_SHA256"
          grep -q '내 아바타' final-apk-check/assets/app.html
          grep -q '학교·학원' final-apk-check/assets/app.html
          grep -q '친구 약속' final-apk-check/assets/app.html
          grep -q 'LOOK 01' final-apk-check/assets/app.html
          grep -q 'SOFT AUTHORITY' final-apk-check/assets/app.html
          ! grep -q 'animation:cloudDrift' final-apk-check/assets/app.html
          ! grep -q 'animation:windSweep' final-apk-check/assets/app.html
          BT="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          "$BT/aapt" dump badging "오늘의 코디 v1.0.1.apk" | tee apk-badging.txt
          grep -q "versionCode='2'" apk-badging.txt
          grep -q "versionName='1.0.1'" apk-badging.txt
          grep -q "package: name='com.todayscodi.app'" apk-badging.txt
          echo 'FINAL APK REGRESSION GATE PASS'

      - name: Prepare QA report
        shell: bash
        run: |
          {
            echo '오늘의 코디 v1.0.1 QA'
            echo 'Source: known-good avatar+teen test APK'
            echo 'Single app.html runtime: PASS'
            echo 'Avatar UI: PASS'
            echo 'Editorial LOOK: PASS'
            echo 'Teen mode: PASS'
            echo 'Horizontal weather motion removed: PASS'
            echo 'Native location bridge: PASS'
            echo "app.html SHA-256: $APP_HTML_SHA256"
            echo 'Same v1.0.0 signing certificate: PASS'
            echo 'Version: 1.0.1 (versionCode 2)'
          } > '오늘의 코디 v1.0.1 QA.txt'

      - name: Upload verified update
        uses: actions/upload-artifact@v4
        with:
          name: today-codi-v1.0.1-verified
          path: |
            오늘의 코디 v1.0.1.apk
            오늘의 코디 v1.0.1 QA.txt
            signing-verification-v1.0.1.txt
          if-no-files-found: error
          retention-days: 90
