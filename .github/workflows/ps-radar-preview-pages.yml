name: PS Radar Online Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ps-radar/preview-v2/**'
      - '.github/workflows/ps-radar-preview-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ps-radar-online-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Validate preview payload
        shell: bash
        run: |
          set -euo pipefail
          test -s ps-radar/preview-v2/index.html
          test -s ps-radar/preview-v2/payload1.txt
          test -s ps-radar/preview-v2/payload2.txt
          test -s ps-radar/preview-v2/payload3.txt
          grep -q 'PS Radar 2.2.' ps-radar/preview-v2/index.html
          python3 - <<'PY'
          import base64,gzip,pathlib
          root=pathlib.Path('ps-radar/preview-v2')
          s=''.join((root/f'payload{i}.txt').read_text().strip() for i in (1,2,3))
          html=gzip.decompress(base64.b64decode(s)).decode('utf-8')
          assert 'PS Radar' in html
          assert 'refreshBtn' in html
          assert 'refreshStatus' in html
          assert len(html)>20000
          print('preview payload OK',len(html))
          PY

      - name: Build Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/psradar-preview-site"
          mkdir -p "$RUNNER_TEMP/psradar-preview-site"
          cp -a . "$RUNNER_TEMP/psradar-preview-site/"
          rm -rf "$RUNNER_TEMP/psradar-preview-site/.git" "$RUNNER_TEMP/psradar-preview-site/.github"
          touch "$RUNNER_TEMP/psradar-preview-site/.nojekyll" "$RUNNER_TEMP/psradar-preview-site/ps-radar/preview-v2/.nojekyll"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/psradar-preview-site

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
