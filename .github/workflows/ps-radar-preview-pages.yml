name: PS Radar Online Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ps-radar/preview-v2/**'
      - '.github/workflows/ps-radar-preview-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ps-radar-online-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Validate preview build
        shell: bash
        run: |
          set -euo pipefail
          test -s ps-radar/preview-v2/index.html
          test -s ps-radar/data/game-info-v229.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          html=Path('ps-radar/preview-v2/index.html').read_text(encoding='utf-8')
          info=json.loads(Path('ps-radar/data/game-info-v229.json').read_text(encoding='utf-8'))
          checks={
            'app title':'PS Radar' in html,
            '2.2.9 version':'2.2.9' in html,
            'refresh':'refreshBtn' in html,
            'Samsung IME fallback':'composeKoreanJamo' in html,
            'text search input':'enterkeyhint="search"' in html,
            'Fold wide search':'grid-column:1/-1' in html,
            'observed history labels':'관측 최대 할인' in html and '역대 최대 할인' not in html,
            'official metadata fetch':'game-info-v229.json' in html,
            'expanded game info':'게임정보 갱신' in html and 'PS Store 공식 설명 보기' in html,
            'official game info safe':info.get('health',{}).get('safeToMerge') is True,
            'official game info count':info.get('health',{}).get('itemCount',0)>=1700,
            'genre coverage':info.get('health',{}).get('genreCount',0)>=1700,
            'publisher coverage':info.get('health',{}).get('publisherCount',0)>=1700,
            'rating coverage':info.get('health',{}).get('ratingCount',0)>=1700,
            'content rating coverage':info.get('health',{}).get('contentRatingCount',0)>=1700,
            'description coverage':info.get('health',{}).get('descriptionCount',0)>=1700,
            'full build':len(html)>20000,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('preview validation failed: '+', '.join(bad))
          print('preview build OK',len(html),checks,info.get('health'))
          PY

      - name: Build Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/psradar-preview-site"
          mkdir -p "$RUNNER_TEMP/psradar-preview-site"
          cp -a . "$RUNNER_TEMP/psradar-preview-site/"
          rm -rf "$RUNNER_TEMP/psradar-preview-site/.git" "$RUNNER_TEMP/psradar-preview-site/.github"
          touch "$RUNNER_TEMP/psradar-preview-site/.nojekyll" "$RUNNER_TEMP/psradar-preview-site/ps-radar/preview-v2/.nojekyll"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/psradar-preview-site

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
