name: PS Radar Curated Catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '25 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'ps-radar/data/catalog-auto.json'
      - 'ps-radar/data/store-auto.json'
      - 'ps-radar/data/deals-auto.json'
      - 'ps-radar/data/game-info-v229.json'
      - 'ps-radar/scripts/build-curated-catalog-v231.mjs'
permissions:
  contents: write
concurrency:
  group: ps-radar-curated-catalog
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node ps-radar/scripts/build-curated-catalog-v231.mjs
      - name: Save catalog if changed
        run: |
          git config user.name "PS Radar Data"
          git config user.email "ps-radar-data@users.noreply.github.com"
          git add ps-radar/data/catalog-curated-v231.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(ps-radar): refresh curated PS5 catalog"
          git pull --rebase origin main
          git push
