name: Deploy PS Radar 2.2.7 Preview Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ps-radar-v227-preview-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Build 2.2.7 standalone preview from verified 2.2.6 payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          root=Path('ps-radar/preview-v2')
          b64=''.join((root/f'payload{i}.txt').read_text().strip() for i in range(1,7))
          html=gzip.decompress(base64.b64decode(b64)).decode('utf-8')
          assert 'PS Radar' in html and '2.2.6' in html and 'compositionstart' in html

          html=html.replace('PS Radar 2.2.6','PS Radar 2.2.7').replace('>2.2.6<','>2.2.7<')
          html=html.replace('<input id="searchInput" type="search" placeholder="게임명 검색..." autocomplete="off" />',
                            '<input id="searchInput" type="text" placeholder="게임명 검색..." autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="search" />')

          css=r'''
          /* === v2.2.7 Fold search + Korean IME hardening === */
          @media(min-width:600px) and (max-width:900px){
            .deal-summary-row{display:grid!important;grid-template-columns:minmax(0,1fr) 86px!important;grid-template-rows:auto auto!important;gap:8px!important;margin-top:12px!important;align-items:center!important}
            .deal-count-box{grid-column:1!important;grid-row:1!important;width:auto!important;height:48px!important}
            .filter-toggle-btn{grid-column:2!important;grid-row:1!important;width:86px!important;height:48px!important;justify-content:center!important;gap:5px!important;font-size:13px!important}
            .search-inline{grid-column:1/-1!important;grid-row:2!important;width:auto!important;height:52px!important;padding:0 13px!important;border-radius:12px!important}
            .search-inline input{font-size:15px!important;min-width:0!important;width:100%!important}
            .search-inline>span{font-size:21px!important}
            .filter-strip{margin-top:10px!important}
          }
          '''
          html=html.replace('</style>',css+'</style>',1)

          pattern=re.compile(r"let searchComposing=false;const commitSearch=value=>\{.*?\$\('#searchClear'\)\.addEventListener\('click',\(\)=>\{.*?\}\);",re.S)
          replacement=r'''let searchComposing=false,searchTimer=0;
          const K_L=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
          const K_V=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
          const K_T=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
          function composeKoreanJamo(value){
            const chars=Array.from(String(value||''));let out='';
            for(let i=0;i<chars.length;){
              const l=K_L.indexOf(chars[i]);const v=(i+1<chars.length)?K_V.indexOf(chars[i+1]):-1;
              if(l>=0&&v>=0){
                let t=0,step=2;
                if(i+2<chars.length){
                  const tc=K_T.indexOf(chars[i+2]);
                  if(tc>0){
                    const followedByVowel=i+3<chars.length&&K_V.includes(chars[i+3]);
                    const canStartNext=K_L.includes(chars[i+2]);
                    if(!(followedByVowel&&canStartNext)){t=tc;step=3;}
                  }
                }
                out+=String.fromCharCode(0xAC00+((l*21+v)*28+t));i+=step;continue;
              }
              out+=chars[i++];
            }
            return out.normalize('NFC');
          }
          const commitSearch=value=>{
            const input=$('#searchInput');
            const normalized=composeKoreanJamo(String(value||'')).trim();
            if(input&&input.value!==normalized)input.value=normalized;
            state.query=normalized;
            if(state.query){state.filter='all';$$('.chip[data-filter]').forEach(x=>x.classList.toggle('active',x.dataset.filter==='all'));}
            state.visible=60;applyFilters();
          };
          const queueSearch=(value,delay=360)=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{if(!searchComposing)commitSearch(value)},delay)};
          const searchInput=$('#searchInput');
          searchInput.addEventListener('compositionstart',()=>{searchComposing=true;clearTimeout(searchTimer)});
          searchInput.addEventListener('compositionupdate',()=>{searchComposing=true;clearTimeout(searchTimer)});
          searchInput.addEventListener('compositionend',e=>{searchComposing=false;queueSearch(e.target.value,30)});
          searchInput.addEventListener('beforeinput',e=>{if(e.inputType==='insertCompositionText')searchComposing=true});
          searchInput.addEventListener('input',e=>{if(e.isComposing||searchComposing||e.inputType==='insertCompositionText'){clearTimeout(searchTimer);return}queueSearch(e.target.value,360)});
          searchInput.addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(searchTimer);searchComposing=false;commitSearch(e.target.value);e.target.blur()}});
          searchInput.addEventListener('blur',e=>{clearTimeout(searchTimer);searchComposing=false;commitSearch(e.target.value)});
          $('#searchClear').addEventListener('click',()=>{clearTimeout(searchTimer);searchComposing=false;searchInput.value='';state.query='';state.visible=60;applyFilters();searchInput.focus();toast('전체 할인 목록으로 돌아왔습니다')});'''
          html,count=pattern.subn(replacement,html,count=1)
          assert count==1, f'search block replacement failed: {count}'
          assert 'PS Radar 2.2.7' in html
          assert 'composeKoreanJamo' in html
          assert 'type="text" placeholder="게임명 검색..."' in html
          assert 'grid-column:1/-1' in html
          root.joinpath('index.html').write_text(html,encoding='utf-8')
          print('2.2.7 standalone preview bytes',len(html.encode('utf-8')))
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('ps-radar/preview-v2/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/psradar-v227.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/psradar-v227.js
          grep -q 'PS Radar 2.2.7' ps-radar/preview-v2/index.html
          grep -q 'composeKoreanJamo' ps-radar/preview-v2/index.html
          grep -q 'enterkeyhint="search"' ps-radar/preview-v2/index.html

      - name: Commit preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PS Radar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add ps-radar/preview-v2/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Deploy PS Radar 2.2.7 wide search and Korean IME fix'
          git push origin HEAD:main
