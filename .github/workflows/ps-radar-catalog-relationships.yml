name: PS Radar Catalog Relationships
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ps-radar-catalog-relationships.yml'
permissions:
  contents: write
concurrency:
  group: ps-radar-catalog-relationships
  cancel-in-progress: false
jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Link verified expansions
        run: node ps-radar/scripts/link-expansions-v232.mjs
      - name: Commit relationships
        run: |
          git add ps-radar/data/store-catalog-v232.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Link verified gameplay expansions to PS5 games'
          git pull --rebase origin main
          git push origin main
