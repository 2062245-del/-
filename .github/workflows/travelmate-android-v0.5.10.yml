name: Build TravelMate v0.5.10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/travelmate-android-v0.5.10.yml'
      - '.ci/travelmate-v0510/apply.py'
  workflow_dispatch:

concurrency:
  group: travelmate-v0510
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: .ci-signing/baro-interpreter.jks
          key: baro-interpreter-release-keystore-v1

      - name: Restore verified v0.5.9 source artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build-src .ci-signing /tmp/v059
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/2062245-del/-/actions/artifacts/11076741268/zip" \
            -o /tmp/v059-artifact.zip
          unzip -q /tmp/v059-artifact.zip -d /tmp/v059
          test -s /tmp/v059/TravelMate_Android_v0.5.9_source.zip
          unzip -q /tmp/v059/TravelMate_Android_v0.5.9_source.zip -d build-src
          grep -q "versionName '0.5.9'" build-src/app/build.gradle

      - name: Apply v0.5.10 patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 .ci/travelmate-v0510/apply.py build-src

      - name: Prepare signing
        shell: bash
        run: |
          set -euxo pipefail
          KEY="$PWD/.ci-signing/baro-interpreter.jks"
          test -s "$KEY"
          echo "BARO_KEYSTORE_PATH=$KEY" >> "$GITHUB_ENV"
          echo "BARO_KEYSTORE_PASSWORD=baro-local-release" >> "$GITHUB_ENV"
          echo "BARO_KEY_ALIAS=baro" >> "$GITHUB_ENV"
          echo "BARO_KEY_PASSWORD=baro-local-release" >> "$GITHUB_ENV"

      - name: Static checks
        shell: bash
        run: |
          set -euxo pipefail
          MAIN=build-src/app/src/main/java/com/seungho/barointerpreter/MainActivity.java
          WALLET=build-src/app/src/main/java/com/seungho/barointerpreter/WalletStore.java
          grep -q 'versionCode 16' build-src/app/build.gradle
          grep -q "versionName '0.5.10'" build-src/app/build.gradle
          grep -q 'heroCountryView.setText(output.flag' "$MAIN"
          grep -q 'nice to meet you' "$MAIN"
          grep -q '나이스 투 미트 유' "$MAIN"
          grep -q 'private void renderWalletDashboard' "$MAIN"
          grep -q '오늘 사용' "$MAIN"
          grep -q '여행 지갑 설정' "$MAIN"
          grep -q 'todaySpent' "$WALLET"
          grep -q 'remainingPercent' "$WALLET"
          grep -q 'com.microsoft.onnxruntime:onnxruntime-android:1.26.0' build-src/app/build.gradle

      - name: Build release APK
        working-directory: build-src
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon :app:assembleRelease

      - name: Verify APK and package source
        shell: bash
        run: |
          set -euxo pipefail
          APK=build-src/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -tq "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -qi '7d411eb878d63e9b30e5a75c65ce1206d195b45a3e5f794955bd78f625b87b85' apk-signature.txt
          "$AAPT" dump badging "$APK" | head -n 25 | tee apk-badging.txt
          grep -q "versionCode='16'" apk-badging.txt
          grep -q "versionName='0.5.10'" apk-badging.txt
          cp "$APK" TravelMate-v0.5.10-arm64.apk
          (cd build-src && zip -qr ../TravelMate_Android_v0.5.10_source.zip . -x 'app/build/*' '.gradle/*')
          sha256sum TravelMate-v0.5.10-arm64.apk > TravelMate-v0.5.10-arm64.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: TravelMate-v0.5.10-arm64
          path: |
            TravelMate-v0.5.10-arm64.apk
            TravelMate-v0.5.10-arm64.sha256
            TravelMate_Android_v0.5.10_source.zip
            apk-signature.txt
            apk-badging.txt
          if-no-files-found: error
          retention-days: 30
