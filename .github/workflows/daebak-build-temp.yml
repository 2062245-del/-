name: Temporary Daebak APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: daebak-android-build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore project
        shell: bash
        run: |
          set -euo pipefail
          sed -n '/^[[:space:]]*UEsDB/p' .github/workflows/daebak-android-build.yml | head -n 1 | sed 's/^[[:space:]]*//' > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.zip
          mkdir -p /tmp/src
          unzip -q /tmp/project.zip -d /tmp/src
          PROJECT_DIR=$(find /tmp/src -maxdepth 1 -type d -name 'daebak-generator-android-*' | head -n 1)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/DaebakGenerator-v6.3-android-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/DaebakGenerator-v6.3-android-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daebak-generator-android-apk
          path: DaebakGenerator-v6.3-android-debug.apk
          if-no-files-found: error
