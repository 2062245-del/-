name: Build TravelMate v0.5.4 Native Isolation APK

on:
  push:
    branches: [main]
    paths:
      - '.ci/travelmate-v054.b64'
      - '.github/workflows/travelmate-android-v0.5.4.yml'
  workflow_dispatch:

concurrency:
  group: travelmate-v054
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: .ci-signing/baro-interpreter.jks
          key: baro-interpreter-release-keystore-v1
      - name: Restore v0.5.4 source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build-src .ci-signing
          base64 --decode .ci/travelmate-v054.b64 > /tmp/travelmate-v054.zip
          echo 'cf21e02a2659a3339db92044dafc0963e5b03e321839b5582d8595cae399df11  /tmp/travelmate-v054.zip' | sha256sum -c -
          unzip -q /tmp/travelmate-v054.zip -d build-src
      - name: Prepare signing
        shell: bash
        run: |
          set -euxo pipefail
          KEY="$PWD/.ci-signing/baro-interpreter.jks"
          test -s "$KEY"
          echo "BARO_KEYSTORE_PATH=$KEY" >> "$GITHUB_ENV"
          echo "BARO_KEYSTORE_PASSWORD=baro-local-release" >> "$GITHUB_ENV"
          echo "BARO_KEY_ALIAS=baro" >> "$GITHUB_ENV"
          echo "BARO_KEY_PASSWORD=baro-local-release" >> "$GITHUB_ENV"
      - name: Static checks
        shell: bash
        run: |
          set -euxo pipefail
          SRC=build-src/TravelMate_Android_v0.5.4
          grep -q "versionCode 10" "$SRC/app/build.gradle"
          grep -q "versionName '0.5.4'" "$SRC/app/build.gradle"
          grep -q 'android:process=":neural_tts"' "$SRC/app/src/main/AndroidManifest.xml"
          grep -q 'private NeuralTtsClient neuralTts' "$SRC/app/src/main/java/com/seungho/barointerpreter/MainActivity.java"
          grep -q 'class NeuralTtsService' "$SRC/app/src/main/java/com/seungho/barointerpreter/NeuralTtsService.java"
          grep -q 'recentNeuralProcessCrash' "$SRC/app/src/main/java/com/seungho/barointerpreter/NeuralTtsClient.java"
          grep -q 'getProcessName' "$SRC/app/src/main/java/com/seungho/barointerpreter/CrashDiagnostics.java"
      - name: Build release APK
        working-directory: build-src/TravelMate_Android_v0.5.4
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          SRC=build-src/TravelMate_Android_v0.5.4
          APK="$SRC/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -q "Signer #1 certificate SHA-256 digest: 7d411eb878d63e9b30e5a75c65ce1206d195b45a3e5f794955bd78f625b87b85" apk-signature.txt
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.seungho.barointerpreter' versionCode='10' versionName='0.5.4'" apk-badging.txt
          grep -q "application-label:'여행메이트'" apk-badging.txt
          unzip -t "$APK" | tee apk-ziptest.txt
          cp "$APK" TravelMate-v0.5.4-arm64.apk
          sha256sum TravelMate-v0.5.4-arm64.apk | tee TravelMate-v0.5.4-arm64.sha256
          ls -lh TravelMate-v0.5.4-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TravelMate-v0.5.4-arm64
          path: |
            TravelMate-v0.5.4-arm64.apk
            TravelMate-v0.5.4-arm64.sha256
            apk-signature.txt
            apk-badging.txt
            apk-ziptest.txt
          if-no-files-found: error
          retention-days: 30
