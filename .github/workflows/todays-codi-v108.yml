name: Build Today Codi v1.0.8

on:
  push:
    branches: [todays-codi-apk-build]
    paths:
      - 'todays-codi-apk/release-v108-trigger.txt'
      - 'todays-codi-apk/scripts/build_v108_app.py'
      - 'todays-codi-apk/app/build.gradle'
      - '.github/workflows/todays-codi-v108.yml'

permissions:
  contents: read
  actions: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_COMPILE_SDK: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  CERT_SHA256: '33d58c26e621bb6142156ae5dcdb6dc2afdc138ddf0ef7f355db792987ad27de'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download verified avatar source APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir verified-source
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10611486029/zip" -o verified-source.zip
          unzip -q verified-source.zip -d verified-source
          VERIFIED_APK=$(find verified-source -type f -name '*.apk' | head -n1)
          test -s "$VERIFIED_APK"
          echo "VERIFIED_APK=$VERIFIED_APK" >> "$GITHUB_ENV"
      - name: Build v1.0.8 app HTML and QA
        run: |
          python3 todays-codi-apk/scripts/build_v108_app.py --apk "$VERIFIED_APK" --out todays-codi-apk/app/src/main/assets/app.html | tee v108-qa.log
          grep -q 'V108_QA=PASS' v108-qa.log
          SHA=$(sed -n 's/^APP_HTML_SHA256=//p' v108-qa.log | tail -n1)
          test -n "$SHA"
          echo "APP_HTML_SHA256=$SHA" >> "$GITHUB_ENV"
      - name: Apply fashion launcher icon
        run: |
          mkdir -p todays-codi-apk/app/src/main/res/drawable
          cat > todays-codi-apk/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" xmlns:aapt="http://schemas.android.com/aapt" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:pathData="M18,4 H90 C97.8,4 104,10.2 104,18 V90 C104,97.8 97.8,104 90,104 H18 C10.2,104 4,97.8 4,90 V18 C4,10.2 10.2,4 18,4 Z"><aapt:attr name="android:fillColor"><gradient android:startX="12" android:startY="8" android:endX="96" android:endY="100" android:type="linear" android:startColor="#FFB38F" android:centerColor="#F56D78" android:endColor="#9D467D" /></aapt:attr></path>
            <path android:pathData="M54,43 L54,36 C54,30.5 58,27 63,27 C68,27 71.5,30.5 71.5,35 C71.5,39.5 68,42 64,44" android:fillColor="@android:color/transparent" android:strokeColor="#FFF9F4" android:strokeWidth="4" android:strokeLineCap="round" android:strokeLineJoin="round" />
            <path android:pathData="M54,47 L25,70 C22.7,71.9 24.1,76 27.2,76 H80.8 C83.9,76 85.3,71.9 83,70 L54,47 Z" android:fillColor="@android:color/transparent" android:strokeColor="#FFF9F4" android:strokeWidth="4" android:strokeLineCap="round" android:strokeLineJoin="round" />
          </vector>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('todays-codi-apk/app/src/main/AndroidManifest.xml');s=p.read_text()
          if 'android:icon=' not in s:s=s.replace('<application\n','<application\n        android:icon="@drawable/ic_launcher"\n        android:roundIcon="@drawable/ic_launcher"\n',1)
          else:s=re.sub(r'android:icon="[^"]+"','android:icon="@drawable/ic_launcher"',s)
          p.write_text(s)
          PY
      - name: Build release APK
        working-directory: todays-codi-apk
        run: gradle :app:assembleRelease --stacktrace
      - name: Restore signing identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir signing
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10612040656/zip" -o signing.zip
          unzip -q signing.zip -d signing
          PASS=$(sed -n 's/^Store password: //p' signing/서명정보.txt | head -n1)
          test -n "$PASS"
          echo "STORE_PASS=$PASS" >> "$GITHUB_ENV"
          cp signing/today-codi-release.jks today-codi-release.jks
      - name: Sign and verify
        run: |
          BT="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          "$BT/zipalign" -f -p 4 todays-codi-apk/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks today-codi-release.jks --ks-key-alias todaycodi --ks-pass "pass:$STORE_PASS" --key-pass "pass:$STORE_PASS" --out "오늘의 코디 v1.0.8.apk" aligned.apk
          "$BT/apksigner" verify --verbose --print-certs "오늘의 코디 v1.0.8.apk" | tee signing.txt
          grep -qi "$CERT_SHA256" signing.txt
      - name: Final single-face gate
        run: |
          rm -rf check && mkdir check
          unzip -q "오늘의 코디 v1.0.8.apk" -d check
          test "$(sha256sum check/assets/app.html | awk '{print $1}')" = "$APP_HTML_SHA256"
          grep -q '__todayCodiAvatarV108SingleFace' check/assets/app.html
          ! grep -q 'let bust=renderBust(p)' check/assets/app.html
          grep -q '__todayCodiAvatarV107GlassesContrast' check/assets/app.html
          grep -q '__todayCodiAvatarV106ViewportFix' check/assets/app.html
          BT="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          "$BT/aapt" dump badging "오늘의 코디 v1.0.8.apk" | tee badging.txt
          grep -q "versionCode='8'" badging.txt
          grep -q "versionName='1.0.8'" badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: today-codi-v1.0.8
          path: |
            오늘의 코디 v1.0.8.apk
            badging.txt
            signing.txt
          retention-days: 90
