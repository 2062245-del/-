<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12100D">
<title>오늘의 코디</title>
<style>
html,body{margin:0;min-height:100%;background:#12100D;color:#f4efe6;font-family:system-ui,-apple-system,sans-serif}
#boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
#boot b{font-size:22px}#boot small{display:block;margin-top:8px;opacity:.7}
</style>
</head>
<body>
<div id="boot"><div><b>오늘의 코디</b><small>앱을 준비하고 있습니다…</small></div></div>
<script>
(async()=>{
  try{
    if(!window.AndroidApp) throw new Error('Android 앱 브리지를 찾지 못했습니다.');
    const b64=AndroidApp.getAssetPart(1)+AndroidApp.getAssetPart(2)+AndroidApp.getAssetPart(3);
    if(!b64) throw new Error('앱 화면 데이터를 읽지 못했습니다.');
    if(!('DecompressionStream' in window)) throw new Error('Android System WebView를 최신 버전으로 업데이트해 주세요.');
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const ds=new DecompressionStream('gzip');
    let html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();

    const nativeScript='<scr'+'ipt>(function(){'+
      'window.NativeGeo={getCurrentPosition:function(success,error,options){window.__nativeGeoSuccess=function(lat,lng,acc){success({coords:{latitude:Number(lat),longitude:Number(lng),accuracy:Number(acc||0)}});};window.__nativeGeoError=function(msg){if(error)error({code:1,message:String(msg||"위치를 확인하지 못했습니다.")});};AndroidApp.requestLocation();}};'+
      'document.documentElement.classList.add("native-apk");'+
      'document.addEventListener("DOMContentLoaded",function(){var b=document.getElementById("installAppBtn");if(b)b.style.display="none";document.body&&document.body.setAttribute("data-native-app","android");});'+
      '})();</scr'+'ipt>';

    html=html.replaceAll('navigator.geolocation.getCurrentPosition','window.NativeGeo.getCurrentPosition');
    if(html.includes('</head>')) html=html.replace('</head>',nativeScript+'</head>');
    else html=nativeScript+html;
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('boot').innerHTML='<div><b>앱을 불러오지 못했습니다.</b><small>'+String(e)+'</small></div>';
  }
})();
</script>
</body>
</html>
