<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14110D"><title>오늘 뭐 입지 | Style Forecast</title><style>html,body{margin:0;background:#14110D;color:#efe9da;font-family:system-ui,sans-serif}#boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}small{opacity:.7}</style></head><body><div id="boot"><div><b>오늘 뭐 입지</b><br><small>스타일 포캐스트를 불러오는 중…</small></div></div><script>(async()=>{try{const urls=["https://raw.githubusercontent.com/2062245-del/-/main/style-forecast/part1.txt","https://raw.githubusercontent.com/2062245-del/-/main/style-forecast/part2.txt","https://raw.githubusercontent.com/2062245-del/-/main/style-forecast/part3.txt","https://raw.githubusercontent.com/2062245-del/-/main/style-forecast/part4.txt","https://raw.githubusercontent.com/2062245-del/-/main/style-forecast/part5.txt","https://raw.githubusercontent.com/2062245-del/-/main/style-forecast/part6.txt"];const parts=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('source '+r.status);return r.text()})));const b=parts.join('');const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('브라우저 압축 해제 기능 미지원');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').innerHTML='<div><b>앱을 불러오지 못했습니다.</b><br><small>'+String(e)+'</small></div>'}})();</script></body></html>
