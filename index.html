<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>유통기한 조사</title>
<style>
  :root{
    --bg:#1C1F22;
    --surface:#24282C;
    --surface-2:#2E3339;
    --text:#F2EFE9;
    --text-dim:#9AA0A6;
    --accent:#E8A33D;
    --ok:#3E7C6A;
    --danger:#C8553D;
    --border:#3A3F45;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:88px;
  }
  header{
    padding:18px 16px 14px;
    border-bottom:1px solid var(--border);
  }
  header h1{
    font-size:17px;
    margin:0 0 2px;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    font-size:12.5px;
    color:var(--text-dim);
  }

  .section{padding:14px 16px;}

  .scanner-box{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
    background:#000;
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--border);
  }
  .scanner-box video{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .viewfinder{
    position:absolute; inset:18% 12%;
    border:2px solid var(--accent);
    border-radius:8px;
    opacity:0.85;
    pointer-events:none;
  }
  .scan-hint{
    position:absolute; bottom:8px; left:0; right:0;
    text-align:center; font-size:12px; color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.6);
  }
  .scanner-off{
    display:flex; align-items:center; justify-content:center;
    height:100%; color:var(--text-dim); font-size:13px; text-align:center; padding:20px;
  }

  .btn-row{display:flex; gap:8px; margin-top:10px;}
  button{
    font-family:inherit; cursor:pointer; border:none; border-radius:8px;
    font-size:14px; font-weight:600; padding:12px 14px;
  }
  .btn-primary{background:var(--accent); color:#1C1F22; flex:1;}
  .btn-secondary{background:var(--surface-2); color:var(--text); border:1px solid var(--border); flex:1;}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid var(--danger); padding:8px 10px; font-size:12px;}
  .btn-full{width:100%;}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px;
    margin-top:12px;
  }
  .code-display{
    font-family:"SF Mono","Roboto Mono",monospace;
    font-size:20px; letter-spacing:0.02em;
    padding:10px 12px; background:var(--surface-2);
    border-radius:6px; border:1px solid var(--border);
    word-break:break-all;
  }
  .code-display.empty{ color:var(--text-dim); font-size:14px; font-family:inherit;}

  label{
    display:block; font-size:12px; color:var(--text-dim);
    margin:12px 0 6px;
  }
  input[type=text], input[type=date], input[type=number]{
    width:100%; padding:11px 12px; font-size:15px;
    background:var(--surface-2); color:var(--text);
    border:1px solid var(--border); border-radius:8px;
    font-family:inherit;
  }
  .qty-row{display:flex; align-items:center; gap:8px;}
  .qty-row button{
    width:40px; height:40px; padding:0; font-size:18px;
    background:var(--surface-2); color:var(--text); border:1px solid var(--border);
    flex:none;
  }
  .qty-row input{text-align:center; flex:1;}

  table{width:100%; border-collapse:collapse; margin-top:4px;}
  th,td{
    text-align:left; padding:9px 6px; font-size:12.5px;
    border-bottom:1px solid var(--border);
  }
  th{color:var(--text-dim); font-weight:500; font-size:11.5px;}
  td.code{font-family:"SF Mono","Roboto Mono",monospace; font-size:12px;}
  .badge{
    display:inline-block; padding:2px 7px; border-radius:20px;
    font-size:11px; font-weight:600;
  }
  .badge.danger{background:rgba(200,85,61,.18); color:#F0917C;}
  .badge.warn{background:rgba(232,163,61,.18); color:var(--accent);}
  .badge.ok{background:rgba(62,124,106,.22); color:#7FCBB5;}

  .empty-state{
    text-align:center; color:var(--text-dim); font-size:13px;
    padding:24px 10px;
  }

  .footer-bar{
    position:fixed; bottom:0; left:0; right:0;
    background:var(--surface);
    border-top:1px solid var(--border);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:12px;
  }
  .footer-count{font-size:12.5px; color:var(--text-dim); flex:none; white-space:nowrap;}
  .footer-bar button{flex:1;}

  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    background:var(--ok); color:#fff; padding:8px 16px; border-radius:20px;
    font-size:12.5px; font-weight:600; opacity:0; transition:opacity .2s;
    pointer-events:none; z-index:50;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <h1>유통기한 조사</h1>
  <p>스캔 → 수량/유통기한 입력 → 추가 → 다음 상품</p>
</header>

<div class="section">
  <div class="scanner-box" id="scannerBox">
    <div class="scanner-off" id="scannerOff">
      카메라를 시작하면 바코드를 자동으로 인식합니다.<br>인식이 안 되면 아래에서 코드를 직접 입력할 수 있습니다.
    </div>
    <video id="video" playsinline muted style="display:none;"></video>
    <div class="viewfinder" id="viewfinder" style="display:none;"></div>
    <div class="scan-hint" id="scanHint" style="display:none;">바코드를 사각형 안에 맞춰주세요</div>
  </div>
  <div class="btn-row">
    <button class="btn-primary" id="toggleScanBtn">카메라 스캔 시작</button>
    <button class="btn-secondary" id="manualBtn">코드 직접입력</button>
  </div>

  <div class="card">
    <label style="margin-top:0;">인식된 상품 코드</label>
    <div class="code-display empty" id="codeDisplay">아직 스캔된 코드가 없습니다</div>
    <input type="text" id="manualInput" placeholder="바코드 직접 입력 후 Enter 또는 확인" style="display:none; margin-top:8px;">

    <label>수량</label>
    <div class="qty-row">
      <button id="qtyMinus" type="button">−</button>
      <input type="number" id="qtyInput" value="1" min="1">
      <button id="qtyPlus" type="button">＋</button>
    </div>

    <label>유통기한</label>
    <input type="date" id="expiryInput">

    <button class="btn-primary btn-full" id="addBtn" style="margin-top:14px;">목록에 추가</button>
  </div>

  <div class="card">
    <label style="margin:0 0 8px;">조사 목록 (<span id="listCount">0</span>건)</label>
    <div id="listWrap">
      <div class="empty-state" id="emptyState">아직 추가된 상품이 없습니다</div>
      <table id="listTable" style="display:none;">
        <thead>
          <tr><th>코드</th><th>수량</th><th>유통기한</th><th>상태</th><th></th></tr>
        </thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="footer-bar">
  <span class="footer-count"><span id="footerCount">0</span>건</span>
  <button class="btn-secondary" id="clearBtn">전체 초기화</button>
  <button class="btn-primary" id="saveBtn">CSV로 저장</button>
</div>

<div class="toast" id="toast"></div>

<script>
let items = [];
let stream = null;
let scanning = false;
let detector = null;
let rafId = null;

const codeDisplay = document.getElementById('codeDisplay');
const manualInput = document.getElementById('manualInput');
const qtyInput = document.getElementById('qtyInput');
const expiryInput = document.getElementById('expiryInput');
const video = document.getElementById('video');
const viewfinder = document.getElementById('viewfinder');
const scanHint = document.getElementById('scanHint');
const scannerOff = document.getElementById('scannerOff');
const toggleScanBtn = document.getElementById('toggleScanBtn');

let currentCode = '';

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1400);
}

function setCode(code){
  currentCode = code;
  codeDisplay.textContent = code;
  codeDisplay.classList.remove('empty');
  if(navigator.vibrate) navigator.vibrate(60);
}

// ---- 카메라 스캔 ----
async function startScan(){
  if(!('BarcodeDetector' in window)){
    showToast('이 브라우저는 자동 스캔 미지원 · 직접입력을 이용하세요');
    document.getElementById('manualBtn').click();
    return;
  }
  try{
    detector = new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39']});
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject = stream;
    video.style.display = 'block';
    viewfinder.style.display = 'block';
    scanHint.style.display = 'block';
    scannerOff.style.display = 'none';
    await video.play();
    scanning = true;
    toggleScanBtn.textContent = '카메라 스캔 중지';
    manualInput.style.display = 'none';
    detectLoop();
  }catch(e){
    showToast('카메라 접근 권한이 필요합니다');
  }
}

function stopScan(){
  scanning = false;
  if(rafId) cancelAnimationFrame(rafId);
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
  video.style.display = 'none';
  viewfinder.style.display = 'none';
  scanHint.style.display = 'none';
  scannerOff.style.display = 'flex';
  toggleScanBtn.textContent = '카메라 스캔 시작';
}

async function detectLoop(){
  if(!scanning) return;
  try{
    const codes = await detector.detect(video);
    if(codes.length > 0){
      setCode(codes[0].rawValue);
      // 같은 코드 연속 인식 방지를 위해 잠깐 멈췄다 재개
      scanning = false;
      setTimeout(()=>{ scanning = true; detectLoop(); }, 900);
      return;
    }
  }catch(e){ /* 프레임 스킵 */ }
  rafId = requestAnimationFrame(detectLoop);
}

toggleScanBtn.addEventListener('click', ()=>{
  if(scanning) stopScan(); else startScan();
});

document.getElementById('manualBtn').addEventListener('click', ()=>{
  stopScan();
  manualInput.style.display = 'block';
  manualInput.value = '';
  manualInput.focus();
});

manualInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && manualInput.value.trim()){
    setCode(manualInput.value.trim());
  }
});

// ---- 수량 ----
document.getElementById('qtyMinus').addEventListener('click', ()=>{
  qtyInput.value = Math.max(1, (parseInt(qtyInput.value)||1) - 1);
});
document.getElementById('qtyPlus').addEventListener('click', ()=>{
  qtyInput.value = (parseInt(qtyInput.value)||1) + 1;
});

// ---- 목록 추가 ----
function dDayInfo(expiry){
  const today = new Date(); today.setHours(0,0,0,0);
  const exp = new Date(expiry); exp.setHours(0,0,0,0);
  const diff = Math.round((exp - today) / 86400000);
  if(diff < 0) return {label:'기한초과', cls:'danger'};
  if(diff <= 30) return {label:`D-${diff}`, cls:'danger'};
  if(diff <= 90) return {label:`D-${diff}`, cls:'warn'};
  return {label:`D-${diff}`, cls:'ok'};
}

function renderList(){
  const body = document.getElementById('listBody');
  const table = document.getElementById('listTable');
  const empty = document.getElementById('emptyState');
  document.getElementById('listCount').textContent = items.length;
  document.getElementById('footerCount').textContent = items.length;

  if(items.length === 0){
    table.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  table.style.display = 'table';
  empty.style.display = 'none';
  body.innerHTML = '';
  items.forEach((it, idx)=>{
    const d = dDayInfo(it.expiry);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="code">${it.code}</td>
      <td>${it.qty}</td>
      <td>${it.expiry}</td>
      <td><span class="badge ${d.cls}">${d.label}</span></td>
      <td><button class="btn-danger" data-idx="${idx}">삭제</button></td>
    `;
    body.appendChild(tr);
  });
  body.querySelectorAll('button[data-idx]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      items.splice(parseInt(btn.dataset.idx), 1);
      renderList();
    });
  });
}

document.getElementById('addBtn').addEventListener('click', ()=>{
  const code = currentCode || manualInput.value.trim();
  const qty = parseInt(qtyInput.value) || 1;
  const expiry = expiryInput.value;

  if(!code){ showToast('상품 코드를 먼저 스캔하거나 입력하세요'); return; }
  if(!expiry){ showToast('유통기한을 입력하세요'); return; }

  items.push({code, qty, expiry});
  renderList();
  showToast('추가되었습니다');

  // 다음 상품을 위해 초기화
  currentCode = '';
  codeDisplay.textContent = '아직 스캔된 코드가 없습니다';
  codeDisplay.classList.add('empty');
  manualInput.value = '';
  qtyInput.value = 1;
  expiryInput.value = '';

  if(!scanning && !('ontouchstart' in window)){}
  if(document.getElementById('manualBtn').dataset.active !== 'true' && !video.style.display.includes('block') && stream === null && !scanning){
    // 카메라가 꺼져있던 경우 자동 재시작 (직접입력 모드였으면 유지)
  }
});

document.getElementById('clearBtn').addEventListener('click', ()=>{
  if(items.length && !confirm('조사 목록을 모두 초기화할까요?')) return;
  items = [];
  renderList();
});

// ---- CSV 저장 ----
document.getElementById('saveBtn').addEventListener('click', ()=>{
  if(items.length === 0){ showToast('저장할 항목이 없습니다'); return; }
  const today = new Date().toISOString().slice(0,10);
  const defaultName = `expiry_survey_${today}`;
  let fileName = prompt('저장할 파일 이름을 입력하세요 (확장자 제외)', defaultName);
  if(fileName === null) return; // 취소
  fileName = fileName.trim();
  if(!fileName) fileName = defaultName;
  // 파일 시스템에서 문제될 수 있는 특수문자 제거
  fileName = fileName.replace(/[\\/:*?"<>|]/g, '');

  const rows = [['바코드','수량','유통기한','조사일']];
  items.forEach(it => rows.push([it.code, it.qty, it.expiry, today]));
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${fileName}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV 파일이 저장되었습니다');
});

renderList();
</script>
</body>
</html>
